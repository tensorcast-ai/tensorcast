<!DOCTYPE html>
<html>
<head>
    <title>Mock Data Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Mock Data Browser Test</h1>
    <p>在浏览器中打开此文件以测试 Mock 数据</p>
    <button onclick="runTests()">运行测试</button>
    <div id="results"></div>

    <script>
        async function testEndpoint(url, name) {
            const result = document.createElement('div');
            result.className = 'test';

            try {
                const response = await fetch(url);
                const data = await response.json();

                result.className += ' success';
                result.innerHTML = `
                    <h3>✅ ${name}</h3>
                    <p>状态: ${response.status}</p>
                    <p>数据结构: ${data.data ? '包含 data' : '无 data'} ${data.meta ? '+ meta' : ''}</p>
                    <details>
                        <summary>查看响应</summary>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </details>
                `;
            } catch (error) {
                result.className += ' error';
                result.innerHTML = `
                    <h3>❌ ${name}</h3>
                    <p>错误: ${error.message}</p>
                `;
            }

            return result;
        }

        async function runTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>测试中...</p>';

            const tests = [
                { url: '/api/summary', name: 'Summary API' },
                { url: '/api/workers', name: 'Workers API' },
                { url: '/api/nodes', name: 'Nodes API' },
                { url: '/api/transports?page=1&page_size=5', name: 'Transports API (分页)' },
                { url: '/api/replicas', name: 'Replicas API' },
            ];

            resultsDiv.innerHTML = '';

            for (const test of tests) {
                const result = await testEndpoint(test.url, test.name);
                resultsDiv.appendChild(result);
            }

            // 添加页面测试链接
            const links = document.createElement('div');
            links.innerHTML = `
                <h2>页面测试链接</h2>
                <ul>
                    <li><a href="/transports" target="_blank">Transports 页面</a></li>
                    <li><a href="/nodes" target="_blank">Nodes 页面</a></li>
                    <li><a href="/mock-test" target="_blank">Mock Test 页面</a></li>
                </ul>
            `;
            resultsDiv.appendChild(links);
        }

        // 自动运行测试
        window.addEventListener('load', () => {
            setTimeout(runTests, 1000);
        });
    </script>
</body>
</html>
