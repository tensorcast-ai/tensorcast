server:
  listen:
    host: 0.0.0.0
    port: 50052
  # Optional: explicitly control the address advertised to the Global Store
  # advertise:
  #   host: 192.168.1.10
  p2p_listen:
    host: 0.0.0.0
    port: 65090
  storage_path: /data/models
  num_threads: 16
engine:
  mem_pool_size_bytes: 8GB
  tx_slice_bytes: 256MB
  artifact_chunk_bytes: 256MB
  streaming_buffer_max_concurrent_sessions: 1
  pinned_allocation_timeout: 30s
  p2p_fallback_disk_dir: ""
  # Optional: limit daemon-served disk materialization to these path prefixes. Empty list allows all.
  disk_path_whitelist: []
high_availability:
  enabled: true
  global_store_endpoints:
    - host: 127.0.0.1
      port: 50051
lifecycle:
  gpu_memory_limit_fraction: 0.75
  enable_periodic_eviction: false
  eviction_loop_interval: 1s
  proc_check_interval: 5s
  sessions_sweep_interval: 10s
  locks_sweep_interval: 10s
  verification_sweep_interval: 500ms
  sessions_ttl: 60s
  locks_ttl: 120s
communicator:
  enable_rdma: false
observability:
  logging:
    level: INFO
  otel:
    enabled: false
    exporter_otlp_endpoint: http://127.0.0.1:4317
    exporter_protocol: grpc
    service_name: tensorcast-store-daemon
checkpoint:
  streaming:
    num_buffers: 4
    io_chunk_bytes: 256MB
    pinned_pool_bytes: 2GB
debug:
  cuda:
    enable_same_process_ipc_fallback: false
