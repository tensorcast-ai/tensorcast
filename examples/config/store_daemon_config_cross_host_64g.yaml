# Cross-host benchmark baseline for 64GiB workers.
# Goal: pass startup memory preflight while keeping enough pinned capacity for
# MTCP c20/b20/w20 style tests.

server:
  num_threads: 16

engine:
  artifact_chunk_bytes: 512MB
  streaming_buffer_chunks: 16
  memory_tiers:
    enable_preemptible: false
    stable_bytes: 16GB
    preemptible_limit_bytes: 0
    preemptible_low_watermark_ratio: 0.4

pinned_memory:
  allocation_timeout: 30s
  classes:
    - name: engine
      slice_bytes: 512MB
      pool_bytes: 16GB
    - name: comm_gpu
      slice_bytes: 16MB
      pool_bytes: 8GB
      rdma_preregister: true
    - name: comm_cpu
      slice_bytes: 4MB
      pool_bytes: 1GB
      rdma_preregister: true

communicator:
  stager:
    stage_cpu_for_rdma: true
