# Global Store配置文件示例
server:
  host: "0.0.0.0"
  port: 50051
  workers: 10                        # gRPC线程数

# 数据库配置
database:
  db_file: "/data/global_store.db"    # DuckDB文件路径，留空使用内存数据库

# Worker管理配置
worker_management:
  heartbeat_timeout_ms: 30000        # Worker心跳超时时间
  cleanup_interval_ms: 60000         # 清理线程运行间隔
  enable_worker_filtering: true      # 是否根据Worker状态过滤副本
  default_heartbeat_interval_ms: 5000 # 默认心跳间隔

# 模型副本管理
model_replicas:
  load_balancing_enabled: true       # 是否启用负载均衡

# 监控配置
monitoring:
  log_level: "INFO"                  # 日志级别
  enable_metrics: true               # 是否启用指标收集