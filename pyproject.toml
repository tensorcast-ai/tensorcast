[build-system]
# Note: The torch version here is the default. When building releases,
# use tools/release.sh with --torch-version to specify different versions
requires = ["setuptools>=68.0.0", "pyyaml", "torch==2.11.0", "toml"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorcast"
description = "Shared tensor layer for distributed inference — load once, share everywhere."
authors = [{ name = "TensorCast Team" }]
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Note: Runtime torch version should match the build-time version
# The package name will include the torch version suffix (e.g., tensorcast-0.0.2+torch26)
dependencies = [
    "click>=8.1.8",
    "fastapi>=0.115.5",
    "grpcio>=1.56.0,<2",
    "grpcio-health-checking>=1.56.0,<2",
    "pandas>=2.2.3",
    "pytz>=2025.2",
    "prometheus-client>=0.21.1",
    "py-grpc-prometheus>=0.8.0",
    "torch==2.11.0",
    "protobuf==7.35.0",
    # OpenTelemetry is a required dependency. No automatic downgrade.
    "opentelemetry-api>=1.36.0",
    "opentelemetry-sdk>=1.36.0",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36.0",
    "opentelemetry-instrumentation-grpc>=0.57b0",
    "uvicorn>=0.32.0",
    "pyyaml>=6.0.2",
    "duckdb>=1.2.1",
    "pydantic>=2.0.0",
    "psutil>=7.0.0",
    "tqdm>=4.66.0",
]

dynamic = ["version", "readme"]

[project.urls]
Repository = "https://github.com/tensorcast-ai/tensorcast"

[dependency-groups]
dev = [
    "clang-format>=20.1.0",
    "clang-tidy>=20.1.0",
    "einops>=0.8.1",
    "grpcio-tools<=1.73.1",
    "httpx>=0.28.1",
    "hypothesis>=6.135.26",
    "ipdb>=0.13.13",
    "ipynb>=0.5.1",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.403",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-xdist>=3.8.0",
    "rich-click>=1.8.9",
    "ruff==0.15.14",
    "toml>=0.10.2",
    "types-protobuf==5.28.3.20241203",
    "safetensors==0.7.0"
]
release = [
    # Toolchain for packaging and publishing the wheel. Maintainers run
    # `uv sync --group release` before invoking tools/release.sh post-process /
    # check / publish*. End users and ordinary developers never need this
    # group, so it stays out of the default sync.
    "wheel>=0.47",
    "auditwheel>=6.6",
    "patchelf>=0.17",  # Python-wrapped patchelf binary; avoids system apt
    "twine>=6.0",
]

[project.scripts]
tensorcast-cli = "tensorcast.cli:main"

[project.optional-dependencies]
build = ["setuptools", "cython"]


[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = [
    "import-untyped",
    "attr-defined",
    "no-untyped-def",
    "arg-type",
    "no-untyped-call",
    "type-arg",
    "var-annotated",
    "no-any-return",
    "misc",
    "untyped-decorator",
]
show_error_codes = true
check_untyped_defs = true
no_implicit_optional = true
python_version = "3.11"
follow_imports = "skip"

exclude = '(^tensorcast/proto/.*|tests|setup\.py)'

[tool.ruff]
target-version = "py310"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    "_build",
    "build",
    "dist",
    ".github",
    "tools",
    "tests",
    "proto",
    "setup.py",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*.pyi",
]

[tool.ruff.lint]
ignore = [
    # # these ignores are from flake8-bugbear; please fix!
    # "B007",
    # "B008",
    # "B017",
    # "B018",   # Useless expression
    # "B019",
    # "B020",
    # "B023",
    # "B024",
    # "B026",
    # "B028",   # No explicit `stacklevel` keyword argument found
    # "B904",
    # "B905",
    # "E402",
    # "C408",   # C408 ignored because we like the dict keyword argument syntax
    "E501", # E501 is not flexible enough, we're using B950 instead
    # "E721",
    # "E731",   # Assign lambda expression
    # "E741",
    # "EXE001",
    # "F405",
    # "F821",
    # "F841",
    # # these ignores are from flake8-logging-format; please fix!
    # "G101",
    # "G201",
    # "G202",
    # "G003",
    "G004",
    # # these ignores are from RUFF perf; please fix!
    "PERF203",
    # "PERF4",
    # "SIM102",
    # "SIM103",
    # "SIM112",  # flake8-simplify code styles
    # "SIM105",  # these ignores are from flake8-simplify. please fix or ignore with commented reason
    # "SIM108",
    # "SIM110",
    # "SIM114",  # Combine `if` branches using logical `or` operator
    # "SIM115",
    # "SIM116",  # Disable Use a dictionary instead of consecutive `if` statements
    # "SIM117",
    # "SIM118",
]
select = [
    "B",
    "C4",
    "G",
    "E",
    "F",
    "SIM1",
    "W",
    "TID252",
    # Not included in flake8
    "PERF",
    "PLE",
]
extend-select = ["I"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = [
    "A",
    "B",
    "C",
    "D",
    "E",
    "F",
    "G",
    "I",
    "N",
    "Q",
    "S",
    "T",
    "W",
    "ANN",
    "ARG",
    "BLE",
    "COM",
    "DJ",
    "DTZ",
    "EM",
    "ERA",
    "EXE",
    "FBT",
    "ICN",
    "INP",
    "ISC",
    "NPY",
    "PD",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "TCH",
    "TID",
    "TRY",
    "UP",
    "YTT",
]
unfixable = []


[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["tensorcast"]

[tool.pyright]
include = ["tensorcast/**", "tests/python/**"]

exclude = ["tensorcast/proto/*", "tensorcast/proto/**/*.pyi"]
# strict = ["tensorcast/global_store"]
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingModuleSource = "none"
pythonVersion = "3.10"
reportAttributeAccessIssue = "none"
reportUnknownMemberType = "none"
reportPrivateImportUsage = "none"

[[tool.uv.index]]
default = true
name = "pypi-public"
url = "https://pypi.org/simple"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
