# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: .
    name: buf.build/tensorcast/tensorcast
lint:
  use:
    - STANDARD
  ignore_only:
    PACKAGE_VERSION_SUFFIX:
      - tensorcast
    RPC_REQUEST_RESPONSE_UNIQUE:
      - tensorcast/global_store/v1/global_store.proto
      - tensorcast/daemon/v2/store_daemon.proto
    RPC_REQUEST_STANDARD_NAME:
      - tensorcast/daemon/v2/store_daemon.proto
    RPC_RESPONSE_STANDARD_NAME:
      - tensorcast/daemon/v2/store_daemon.proto
breaking:
  use:
    - FILE
