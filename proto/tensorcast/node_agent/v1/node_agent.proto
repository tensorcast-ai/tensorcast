syntax = "proto3";

package tensorcast.node_agent.v1;

import "google/protobuf/timestamp.proto";
import "tensorcast/common/v1/common.proto";
import "tensorcast/daemon/v2/store_daemon.proto";
import "tensorcast/plan/v1/plan.proto";
import "tensorcast/publication/v1/publication.proto";

service NodeAgentService {
  rpc ExecutePlan(ExecutePlanRequest) returns (ExecutePlanResponse) {}
  rpc GetAgentInfo(GetAgentInfoRequest) returns (GetAgentInfoResponse) {}
}

message ExecutePlanRequest {
  tensorcast.plan.v1.PlanSpec plan = 1;
  bool dry_run = 2;
}

message ExecutePlanResponse {
  string request_id = 1;
  bool ok = 2;
  repeated StepResult steps = 3;
}

message ArtifactBatchOutcome {
  string artifact_id = 1;
  string status_code = 2;
  string message = 3;
}

message ArtifactManifestResult {
  string engine_request_id = 1;
  string layout_id = 2;
  repeated string artifact_ids = 3;
  string key_set_digest_alg = 4;
  string key_set_digest_hex = 5;
  tensorcast.plan.v1.ManifestArtifactSetBridge manifest_bridge = 6;
}

message ArtifactPublishResult {
  ArtifactManifestResult manifest = 1;
  repeated ArtifactBatchOutcome put_outcomes = 2;
}

message ArtifactHydrateResult {
  ArtifactManifestResult manifest = 1;
  repeated ArtifactBatchOutcome get_outcomes = 2;
  repeated string missing_artifact_ids = 3;
}

message ArtifactBatchResult {
  optional string engine_request_id = 1;
  repeated ArtifactBatchOutcome outcomes = 2;
}

message PureTransformPublicationResult {
  string serving_artifact_id = 1;
  string serving_manifest_ref = 2;
  string manifest_tensor_name = 3;
  bytes serving_manifest_bytes = 4;
  tensorcast.daemon.v2.RepresentationPublishContract representation_publish_contract = 5;
  tensorcast.daemon.v2.AssemblyCloseoutContract closeout_contract = 6;
  optional string source_artifact_ref = 7;
  optional string contract_family = 8;
  repeated string structural_view_ids = 9;
}

message ArtifactSetItemResult {
  tensorcast.common.v1.SelectionIdentity item_identity = 1;
  optional string artifact_id = 2;
  OperationStatus status = 3;
}

message ArtifactSetResult {
  string set_digest_hex = 1;
  repeated ArtifactSetItemResult outcomes = 2;
}

message ArtifactActionResult {
  oneof result {
    ArtifactManifestResult manifest = 1;
    ArtifactPublishResult publish = 2;
    ArtifactHydrateResult hydrate = 3;
    ArtifactBatchResult evict_local = 4;
    PureTransformPublicationResult pure_transform_publication = 5;
    tensorcast.publication.v1.RepresentationPublishSpec representation_publish = 6;
  }
}

message StepResult {
  string step_id = 1;
  string target_id = 2;
  string action = 3;
  OperationStatus status = 4;
  ArtifactActionResult artifact_result = 5;
  ArtifactSetResult artifact_set_result = 6;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_PENDING = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_SUCCESS = 3;
  OPERATION_STATE_FAILED = 4;
  OPERATION_STATE_CANCELLED = 5;
  OPERATION_STATE_DEGRADED = 6;
}

message OperationError {
  string status_code = 1;
  string message = 2;
  bool retryable = 3;
}

message OperationStatus {
  OperationState state = 1;
  string message = 2;
  double progress = 3;
  google.protobuf.Timestamp as_of = 4;
  OperationError error = 5;
}

message GetAgentInfoRequest {}

message GetAgentInfoResponse {
  string agent_id = 1;
  string daemon_id = 2;
  string instance_id = 3;
  string version = 4;
}
