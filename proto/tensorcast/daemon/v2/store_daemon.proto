  int64 as_of_ms = 9; // Server-side snapshot timestamp in epoch milliseconds
  uint64 staleness_ms = 10; // Freshness budget already consumed for this snapshot
  uint64 cache_epoch = 11; // Monotonic daemon-side freshness evidence for snapshots
  string freshness_state = 12; // current | degraded | stale
}

