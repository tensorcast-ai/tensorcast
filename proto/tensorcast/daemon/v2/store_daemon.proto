  BINDING_CONTRIBUTION_KIND_UNSPECIFIED = 0;
  BINDING_CONTRIBUTION_KIND_PIECE_PARTIAL = 1;
  BINDING_CONTRIBUTION_KIND_CANONICAL_FULL = 2;
}

message SubmitBindingContributionRequest {
  string attempt_id = 1;
  string workspace_assembly_id = 2;
  string binding_id = 3;
  string binding_value_id = 4;
  string view_id = 5;
  string coverage_plan_hash = 6;
  BindingContributionKind contribution_kind = 7;
  string coordinator_operation_id = 8;
  uint64 coordinator_generation = 9;
  string attempt_intent_digest = 10;
}

message SubmitBindingContributionResponse {
  bool accepted = 1;
  bool already_exists = 2;
  string lease_id = 3;
  uint64 lease_generation = 4;
  string state = 5;
  string slot_id = 6;
}

message SealAssemblyRequest {
  string assembly_id = 1;
  bool publish_canonical = 2;
}

message SealAssemblyResponse {
  string sealed_artifact_id = 1;
  tensorcast.common.v1.ArtifactDescriptor descriptor = 2;
  bool already_sealed = 3;
}

message RepresentationPublishContract {
  string serving_artifact_id = 1;
  string serving_manifest_ref = 2;
  string representation_contract_hash = 3;
  string serving_build_digest = 4;
  string serving_build_digest_version = 5;
  tensorcast.publication.v1.ServingPublicationSubject subject = 6;
}

message SealAssemblyResult {
  tensorcast.common.v1.ArtifactDescriptor artifact = 1;
  string representation_contract_hash = 2;
  tensorcast.common.v1.ArtifactDescriptor serving_artifact = 3;
  string source_version_key = 4;
  string serving_version_key = 5;
  string serving_manifest_ref = 6;
  string serving_build_digest = 7;
  ExecutionDiagnostics serving_execution_diagnostics = 8;
}

message StartSealAssemblyRequest {
  string assembly_id = 1;
  // Optional explicit layout selection; if absent, sealing uses the current assembly layout binding (if any).
  string layout_id = 2;
}

message StartSealAssemblyResponse {
  tensorcast.operation.v1.OperationRef operation = 1;
}

message SealAssemblyAttemptRequest {
  string attempt_id = 1;
}

message SealAssemblyAttemptResponse {
  tensorcast.operation.v1.OperationRef operation = 1;
}

enum AssemblyTargetKind {
  ASSEMBLY_TARGET_KIND_UNSPECIFIED = 0;
  ASSEMBLY_TARGET_KIND_STRUCTURAL_VIEW = 1;
  ASSEMBLY_TARGET_KIND_CANONICAL_LAYOUT = 2;
}

message AssemblyTargetRef {
  AssemblyTargetKind kind = 1;
  string structural_view_id = 2;
}

message AssemblyRequirement {
  string slot_id = 1;
  AssemblyTargetRef target = 2;
  string coverage_contract = 3;
}

message AssemblyRequirementSetRef {
  string requirements_digest = 1;
  uint64 requirement_count = 2;
  string carrier_form = 3;
  repeated AssemblyRequirement inline_requirements = 4;
}

enum AssemblyContributorLivenessMode {
  ASSEMBLY_CONTRIBUTOR_LIVENESS_MODE_UNSPECIFIED = 0;
  ASSEMBLY_CONTRIBUTOR_LIVENESS_MODE_REQUIRE_LIVE_UNTIL_CUT = 1;
  ASSEMBLY_CONTRIBUTOR_LIVENESS_MODE_ALLOW_DURABLE_OCCUPANCY = 2;
}

message AssemblyReadinessPolicy {
  AssemblyContributorLivenessMode contributor_liveness_mode = 1;
}

enum AssemblyCloseoutKind {
  ASSEMBLY_CLOSEOUT_KIND_UNSPECIFIED = 0;
  ASSEMBLY_CLOSEOUT_KIND_SOURCE_PUBLISH_ONLY = 1;
  ASSEMBLY_CLOSEOUT_KIND_REPRESENTATION_PUBLISH = 2;
  ASSEMBLY_CLOSEOUT_KIND_ROLLOUT_GATED_PUBLISH = 3;
}

message AssemblyCloseoutContract {
  AssemblyCloseoutKind kind = 1;
  string closeout_contract_digest = 2;
  string source_version_key = 3;
  string serving_version_key = 4;
  string serving_artifact_id = 5;
  string serving_manifest_ref = 6;
  RepresentationPublishContract representation_publish_contract = 7;
}

message AssemblyAttemptIntent {
  string layout_id = 1;
  AssemblyRequirementSetRef requirements = 2;
  AssemblyReadinessPolicy readiness_policy = 3;
  AssemblyCloseoutContract closeout_contract = 4;
  string attempt_intent_digest = 5;
}

message AssemblyAttemptRecord {
  string attempt_id = 1;
  string workspace_assembly_id = 2;
  AssemblyAttemptIntent intent = 3;
}

message AssemblyReadinessCutView {
  string structural_view_id = 1;
  bytes meta_digest = 2;
  string view_spec_json = 3;
  uint64 view_size_bytes = 4;
  string view_data_hash = 5;
  uint64 canonical_size_bytes = 6;
  uint64 canonical_bytes_covered = 7;
  repeated CanonicalRange canonical_ranges = 8;
}

message AssemblyReadinessCutSlot {
  string slot_id = 1;
  string structural_view_id = 2;
  string binding_id = 3;
  string binding_value_id = 4;
  string lease_id = 5;
  uint64 lease_generation = 6;
}

message AssemblyReadinessCut {
  string attempt_id = 1;
  string attempt_intent_digest = 2;
  uint64 coordinator_generation = 3;
  uint64 workspace_layout_binding_version = 4;
  repeated AssemblyReadinessCutView views = 5;
  repeated AssemblyReadinessCutSlot live_slots = 6;
}

message WaitOperationRequest {
  string operation_id = 1;
  uint64 timeout_ms = 2;
  tensorcast.operation.v1.OperationRef ref = 3;
}

message WaitOperationResponse {
  tensorcast.operation.v1.GetOperationResponse operation = 1;
}

// ========== Persistence ==========
message PersistenceShardStatus {
  string shard_id = 1;
  uint32 shard_idx = 2;
  PersistenceState state = 3;
  double progress = 4;
  string degraded_reason = 5;
  string last_error = 6;
  repeated string target_nodes = 7;
  repeated string lease_ids = 8;
}

message StartPersistenceRequest {
  string artifact_id = 1;
  StorePolicy policy = 2;
  reserved 3;
  reserved "placement_policy", "persist_to_shared_disk";
  string key_hint = 4;
}

message StartPersistenceResponse {
  string task_id = 1;
  string plan_id = 2;
  PersistenceState state = 3;
  double progress = 4;
  string degraded_reason = 5;
}

message QueryPersistenceStatusRequest {
  string task_id = 1;
  string artifact_id = 2;
}

message QueryPersistenceStatusResponse {
  string task_id = 1;
  string artifact_id = 2;
  string plan_id = 3;
  PersistenceState state = 4;
  double progress = 5;
  string degraded_reason = 6;
  string last_error = 7;
  repeated PersistenceShardStatus shards = 8;
}

message WaitPersistenceStatusRequest {
  string task_id = 1;
  // Server-side wait budget. When unset/0, the server waits until the task
  // reaches a terminal state or until the RPC deadline expires.
  uint32 timeout_ms = 2;
}

message WaitPersistenceStatusResponse {
  QueryPersistenceStatusResponse status = 1;
}
