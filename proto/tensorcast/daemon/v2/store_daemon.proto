syntax = "proto3";

package tensorcast.daemon.v2;

import "google/protobuf/timestamp.proto";
import "tensorcast/common/v1/common.proto";
import "tensorcast/operation/v1/operation.proto";

service StoreDaemonService {
  rpc MaterializeReplica(MaterializeReplicaRequest) returns (MaterializeReplicaResponse) {}
  rpc MaterializeIntoTarget(MaterializeIntoTargetRequest) returns (MaterializeIntoTargetResponse) {}
  rpc MaterializeIntoMappedTarget(MaterializeIntoMappedTargetRequest) returns (MaterializeIntoTargetResponse) {}
  rpc ConfirmReplica(ConfirmReplicaRequest) returns (ConfirmReplicaResponse) {}
  rpc UnloadReplica(UnloadReplicaRequest) returns (UnloadReplicaResponse) {}

  rpc ClearMem(ClearMemRequest) returns (ClearMemResponse) {}

  rpc GetServerConfig(GetServerConfigRequest) returns (GetServerConfigResponse) {}

  // Worker健康检测
  rpc GetWorkerStatus(GetWorkerStatusRequest) returns (GetWorkerStatusResponse) {}

  // ------------------------------------------------------------------
  // Asynchronous artifact integrity verification support.  Each MaterializeReplica
  // request triggers a background verification task on the daemon side.
  // Clients can poll/wait for the outcome via this RPC.
  // ------------------------------------------------------------------

  // Wait until the daemon finishes verifying the specified artifact replica
  // (identified by the <artifact_id, replica_uuid> tuple) or the
  // provided timeout elapses.  The call returns the current verification
  // status so that clients can decide whether to retry or abort.
  rpc WaitReplicaVerification(WaitReplicaVerificationRequest) returns (WaitReplicaVerificationResponse) {}

  // 获取详细状态信息（以 Artifact/Replica 术语为准）
  rpc GetDetailedStatus(GetDetailedStatusRequest) returns (GetDetailedStatusResponse) {}

  // V2 with pagination
  rpc GetLoadedReplicasV2(GetLoadedReplicasV2Request) returns (GetLoadedReplicasV2Response) {}

  // ========== Distributed chunk locking ==========
  // Dual-end locking mechanism for P2P transfers
  rpc LockTransportChunks(LockTransportChunksRequest) returns (LockTransportChunksResponse) {}
  rpc UnlockTransportChunks(UnlockTransportChunksRequest) returns (UnlockTransportChunksResponse) {}

  // ========== Memory Artifact Registration ==========
  // New canonical RPC names
  // Begin a registration session; returns a registration_id and plan-specific handshake.
  rpc BeginRegisterArtifact(BeginRegisterArtifactRequest) returns (BeginRegisterArtifactResponse) {}
  // Clients should prefer FeedRegisterArtifactStream.
  rpc FeedRegisterArtifactStream(stream FeedRegisterArtifactStreamRequest) returns (FeedRegisterArtifactStreamResponse) {}
  rpc KeepAliveRegisterArtifact(KeepAliveRegisterArtifactRequest) returns (KeepAliveRegisterArtifactResponse) {}
  rpc CommitRegisteredArtifact(CommitRegisteredArtifactRequest) returns (CommitRegisteredArtifactResponse) {}
  rpc AbortRegisteredArtifact(AbortRegisteredArtifactRequest) returns (AbortRegisteredArtifactResponse) {}
  rpc RevokeRegisteredArtifact(RevokeRegisteredArtifactRequest) returns (RevokeRegisteredArtifactResponse) {}
  rpc RegisterVramRegion(RegisterVramRegionRequest) returns (RegisterVramRegionResponse) {}
  rpc UnregisterVramRegion(UnregisterVramRegionRequest) returns (UnregisterVramRegionResponse) {}
  rpc DeregisterArtifact(DeregisterArtifactRequest) returns (DeregisterArtifactResponse) {}
  rpc PublishTargetReplica(PublishTargetReplicaRequest) returns (PublishTargetReplicaResponse) {}
  rpc RetirePublishedReplica(RetirePublishedReplicaRequest) returns (RetirePublishedReplicaResponse) {}

  // ========== Key mapping and publish ==========
  rpc ImportArtifactFromPath(ImportArtifactFromPathRequest) returns (ImportArtifactFromPathResponse) {}
  rpc ImportArtifactFromPathStream(ImportArtifactFromPathRequest) returns (stream ImportArtifactFromPathStreamEvent) {}
  rpc QueryReplicaStatus(QueryReplicaStatusRequest) returns (QueryReplicaStatusResponse) {}
  rpc WaitReplicaStatus(WaitReplicaStatusRequest) returns (WaitReplicaStatusResponse) {}
  rpc ReleaseReplica(ReleaseReplicaRequest) returns (ReleaseReplicaResponse) {}
  rpc CreatePlacementLease(CreatePlacementLeaseRequest) returns (CreatePlacementLeaseResponse) {}
  rpc RenewPlacementLease(RenewPlacementLeaseRequest) returns (RenewPlacementLeaseResponse) {}
  rpc ReleasePlacementLease(ReleasePlacementLeaseRequest) returns (ReleasePlacementLeaseResponse) {}
  rpc AcquireRetentionHandle(AcquireRetentionHandleRequest) returns (AcquireRetentionHandleResponse) {}
  rpc RenewRetentionHandle(RenewRetentionHandleRequest) returns (RenewRetentionHandleResponse) {}
  rpc ReleaseRetentionHandle(ReleaseRetentionHandleRequest) returns (ReleaseRetentionHandleResponse) {}
  rpc PublishReplicaKey(PublishReplicaKeyRequest) returns (PublishReplicaKeyResponse) {}
  // Resolve a human-friendly key to an artifact id and optional disk hint.
  rpc ResolveKeyMapping(ResolveKeyMappingRequest) returns (ResolveKeyMappingResponse) {}
  // Swap a key mapping to a new artifact id with optional CAS guardrails.
  rpc SwapKeyMapping(SwapKeyMappingRequest) returns (SwapKeyMappingResponse) {}
  // Fetch canonical tensor index bytes by artifact_id.
  rpc GetArtifactIndexById(GetArtifactIndexByIdRequest) returns (GetArtifactIndexByIdResponse) {}
  // Seal an assembly (cgid) into a stable mi2 identity.
  rpc SealAssembly(SealAssemblyRequest) returns (SealAssemblyResponse) {}
  // Start sealing as a long-tail Operation.
  rpc StartSealAssembly(StartSealAssemblyRequest) returns (StartSealAssemblyResponse) {}
  // Query a long-tail operation by operation_id.
  rpc GetOperation(tensorcast.operation.v1.GetOperationRequest) returns (tensorcast.operation.v1.GetOperationResponse) {}
  // Wait for a long-tail operation to reach a terminal state.
  rpc WaitOperation(WaitOperationRequest) returns (WaitOperationResponse) {}

  // ========== Persistence ==========
  // See docs/architecture/api/policy-persistence.md for policy and task flow.
  rpc StartPersistence(StartPersistenceRequest) returns (StartPersistenceResponse) {}
  rpc QueryPersistenceStatus(QueryPersistenceStatusRequest) returns (QueryPersistenceStatusResponse) {}
  rpc WaitPersistenceStatus(WaitPersistenceStatusRequest) returns (WaitPersistenceStatusResponse) {}
}

message GetServerConfigRequest {}

message GetServerConfigResponse {
  int64 mem_pool_size = 1;
  // Reserved: previously chunk_size (legacy transfer slice)
  reserved 2;
  reserved "chunk_size";
  // Reserved: previously grpc_frame_max_bytes
  reserved 3;
  reserved "grpc_frame_max_bytes";
  // Artifact chunk size used by UMA/VS layout (bytes). Ranges should not cross this boundary.
  uint64 artifact_chunk_bytes = 4;
  // Canonical transfer slice/window size (pinned pool block size).
  uint64 tx_slice_bytes = 5;
  // Unix domain socket path for local handle plane (FD handoff + lease release).
  string local_handle_socket_path = 6;
  // True when CPU shared-memory materialization is enabled.
  bool cpu_shared_memory_enabled = 7;
}

message RegisterRequest {
  string disk_path = 1;
}

message RegisterResponse {
  string disk_path = 1;
  int64 artifact_size = 2;
}

enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_CPU = 1;
  DEVICE_TYPE_GPU = 2;
  DEVICE_TYPE_DISK = 3;
}

enum TransformPlacement {
  TRANSFORM_PLACEMENT_UNSPECIFIED = 0;
  TRANSFORM_PLACEMENT_SERVER = 1;
  TRANSFORM_PLACEMENT_CLIENT = 2;
}

// Hint for selecting the preferred materialization source.
enum SourcePreference {
  SOURCE_PREFERENCE_UNSPECIFIED = 0;
  SOURCE_PREFERENCE_AUTO = 1;
  SOURCE_PREFERENCE_PREFER_P2P = 2;
  SOURCE_PREFERENCE_PREFER_DISK = 3;
}

enum ExportPolicy {
  EXPORT_POLICY_UNSPECIFIED = 0;
  EXPORT_POLICY_NEVER = 1;
  EXPORT_POLICY_AUTO = 2;
  EXPORT_POLICY_FORCE = 3;
}

// Source selection policy that can further gate which sources are allowed.
message SourcePolicy {
  SourcePreference preference = 1;
  optional bool allow_p2p = 2;
  optional bool allow_disk = 3;
}

// Actual source used to serve a materialization request.
enum MaterializationSource {
  MATERIALIZATION_SOURCE_UNSPECIFIED = 0;
  MATERIALIZATION_SOURCE_DISK = 1;
  MATERIALIZATION_SOURCE_P2P = 2;
  MATERIALIZATION_SOURCE_LOCAL_REPLICA = 3;
}

enum LeaseMode {
  LEASE_MODE_UNSPECIFIED = 0;
  // Legacy behavior: daemon may create PID-bound use leases and handle leases
  // for loopback/UDS callers.
  LEASE_MODE_PID = 1;
  // Programmable control-plane mode: do not mint handle leases and do not
  // create PID-bound use leases (even for loopback/UDS callers).
  LEASE_MODE_NO_LEASE = 2;
}

enum PlacementPolicy {
  PLACEMENT_POLICY_UNSPECIFIED = 0;
  PLACEMENT_POLICY_LOCAL_ONLY = 1;
  PLACEMENT_POLICY_REPLICATED = 2;
  PLACEMENT_POLICY_SHARDED = 3;
}

enum PolicyProfile {
  POLICY_PROFILE_UNSPECIFIED = 0;
  POLICY_PROFILE_CACHE = 1;
  POLICY_PROFILE_DURABLE = 2;
  POLICY_PROFILE_HA = 3;
  POLICY_PROFILE_COLD = 4;
  POLICY_PROFILE_PINNED = 5;
  POLICY_PROFILE_WARM = 6;
}

enum PolicyTier {
  POLICY_TIER_UNSPECIFIED = 0;
  POLICY_TIER_STABLE_DRAM = 1;
  POLICY_TIER_SHARED_DISK = 2;
}

enum PolicyScope {
  POLICY_SCOPE_UNSPECIFIED = 0;
  POLICY_SCOPE_LOCAL = 1;
  POLICY_SCOPE_REMOTE = 2;
  POLICY_SCOPE_ANY = 3;
}

enum RetentionPolicy {
  RETENTION_POLICY_UNSPECIFIED = 0;
  RETENTION_POLICY_BEST_EFFORT = 1;
  RETENTION_POLICY_TTL = 2;
  RETENTION_POLICY_PINNED = 3;
}

enum OverflowPolicy {
  OVERFLOW_POLICY_UNSPECIFIED = 0;
  OVERFLOW_POLICY_EVICT = 1;
  OVERFLOW_POLICY_SPILL = 2;
  OVERFLOW_POLICY_REJECT = 3;
}

enum PolicyLayout {
  POLICY_LAYOUT_UNSPECIFIED = 0;
  POLICY_LAYOUT_AUTO = 1;
  POLICY_LAYOUT_UNSHARDED = 2;
  POLICY_LAYOUT_SHARDED = 3;
}

enum PersistenceState {
  PERSISTENCE_STATE_UNSPECIFIED = 0;
  PERSISTENCE_STATE_PENDING = 1;
  PERSISTENCE_STATE_RUNNING = 2;
  PERSISTENCE_STATE_DEGRADED = 3;
  PERSISTENCE_STATE_SUCCESS = 4;
  PERSISTENCE_STATE_FAILED = 5;
}

message MemCopyHandle {
  oneof handle {
    bytes cuda_ipc_handle = 1;
    CpuMemfdHandle cpu_memfd = 2;
  }
  // Opaque capability token bound to the daemon-side handle lifetime.
  bytes lease_token = 3;
}

message CpuMemfdHandle {
  uint64 size_bytes = 1;
  uint64 offset_bytes = 2;
}

message CanonicalRange {
  uint64 offset = 1;
  uint64 length = 2;
}

message TierSpec {
  PolicyTier tier = 1;
  PolicyScope scope = 2;
  uint32 min_replicas = 3;
  RetentionPolicy retention_policy = 4;
  optional uint64 retention_ttl_ms = 5;
}

message StorePolicy {
  PolicyProfile profile = 1;
  repeated TierSpec must = 2;
  repeated TierSpec should = 3;
  repeated TierSpec may = 4;
  OverflowPolicy overflow_policy = 5;
  PolicyLayout layout = 6;
}

message ViewRegistrationOptions {
  string view_id = 1;
  tensorcast.common.v1.ViewSpec spec = 2;
  TransformPlacement placement = 3;
  uint64 canonical_size_bytes = 4;
  repeated CanonicalRange ranges = 5;
  bool allow_partial = 6 [deprecated = true];
  ViewRegistrationKind registration_kind = 7;
}

enum ViewRegistrationKind {
  VIEW_REGISTRATION_KIND_UNSPECIFIED = 0;
  VIEW_REGISTRATION_KIND_CANONICAL = 1;
  VIEW_REGISTRATION_KIND_PIECE = 2;
}

message TensorPayloadDescriptor {
  string name = 1;
  repeated int64 shape = 2;
  repeated int64 stride = 3;
  uint64 buffer_offset = 4;
  uint64 byte_length = 5;
  uint64 storage_offset = 6;
  string dtype = 7;
  string device_uuid = 8;
}

message TargetTensorOffset {
  string name = 1;
  string storage_id = 2;
  uint64 storage_offset = 3;
  uint64 logical_length = 4;
}

message TargetLayout {
  enum LayoutKind {
    LAYOUT_KIND_COALESCED_UNSPECIFIED = 0;
    LAYOUT_KIND_TENSOR_TABLE = 1;
  }

  enum IndexKind {
    INDEX_KIND_CANONICAL_UNSPECIFIED = 0;
    INDEX_KIND_VIEW = 1;
  }

  enum TensorSpecKind {
    TENSOR_SPEC_KIND_ALIAS_UNSPECIFIED = 0;
    TENSOR_SPEC_KIND_OFFSETS = 1;
  }

  repeated StorageEntry storages = 1;
  repeated TensorAlias aliases = 2;
  repeated TargetTensorOffset offsets = 3;
  LayoutKind layout_kind = 4;
  IndexKind index_kind = 5;
  string view_id = 6;
  TensorSpecKind tensor_spec_kind = 7;
  bytes logical_layout_hash = 8;
}

message ViewSubset {
  repeated string tensor_names = 1;
  bytes subset_hash = 2;
}

message ReplicaTicket {
  string replica_uuid = 1;
  MaterializeReplicaStatus status = 2;
  google.protobuf.Timestamp created_at = 3;
  string device_uuid = 4;
  google.protobuf.Timestamp expires_at = 5;
}

enum ReplicaOperationState {
  REPLICA_OPERATION_STATE_UNSPECIFIED = 0;
  REPLICA_OPERATION_STATE_PENDING = 1;
  REPLICA_OPERATION_STATE_RUNNING = 2;
  REPLICA_OPERATION_STATE_SUCCESS = 3;
  REPLICA_OPERATION_STATE_FAILED = 4;
  REPLICA_OPERATION_STATE_CANCELLED = 5;
  REPLICA_OPERATION_STATE_DEGRADED = 6;
}

message ReplicaOperationError {
  // gRPC canonical code name (e.g. DEADLINE_EXCEEDED).
  string status_code = 1;
  string message = 2;
  bool retryable = 3;
}

message ReplicaOperationStatus {
  ReplicaOperationState state = 1;
  string message = 2;
  double progress = 3;
  google.protobuf.Timestamp as_of = 4;
  optional ReplicaOperationError error = 5;
}

message MaterializeReplicaRequest {
  tensorcast.common.v1.ArtifactSelection selection = 1;
  reserved 2;
  reserved "disk_fallback";

  string replica_uuid = 3;
  string device_uuid = 4;
  DeviceType target_device_type = 5;
  int32 pinned_allocation_timeout_ms = 6;
  int32 pid = 7; // Process ID for reference tracking
  int64 size_bytes = 8; // Artifact size in bytes (for reference tracking)

  SourcePreference preference = 9;
  SourcePolicy source_policy = 14;
  LeaseMode lease_mode = 15;

  reserved 10, 11, 12, 13, 1001, 1002;
  reserved "tensor_names", "view_subset_hash", "verify_checksums", "disk_path", "view", "view_id";

  TransformPlacement placement = 1003;
  bool wait_for_completion = 1004;
  // Server-side wait budget for managed shared-disk readiness. When >0 and the
  // initial materialization attempt fails, the daemon waits for a managed disk
  // location in the local cluster before retrying disk-only.
  uint32 wait_for_shared_disk_ms = 16;
  ExportPolicy export_policy = 17;
}

// MaterializeReplica now returns immediately after memory allocation succeeds.
// The actual data loading continues in the background.
enum MaterializeReplicaStatus {
  MATERIALIZE_REPLICA_STATUS_UNSPECIFIED = 0; // Unspecified initial state
  MATERIALIZE_REPLICA_STATUS_ALLOCATED = 1; // Memory allocated, loading in progress
  MATERIALIZE_REPLICA_STATUS_FAILED = 2; // Allocation or initial setup failed
}

message MaterializeReplicaResponse {
  string artifact_id = 1;
  string disk_path = 2;
  MemCopyHandle mem_handle = 3;
  MaterializeReplicaStatus status = 4;
  MaterializationSource source = 5;
  bytes canonical_index_bytes = 6;
  ViewSubset view_subset = 7;
  repeated TensorPayloadDescriptor payloads = 8;
  ReplicaTicket ticket = 9;
  bytes view_index_bytes = 10;
  uint64 generation = 11;
  tensorcast.common.v1.ArtifactSelection resolved_selection = 12;

  // Legacy view metadata for compatibility with view-based callers.
  bytes view_index_json = 1001;
  string view_data_hash = 1002;
}

message CopyPlanRange {
  int32 dim = 1;
  int64 start = 2;
  int64 end = 3;
}

message CopyPlanEntry {
  string ckpt_name = 1;
  CopyPlanRange ckpt_range = 2;
  string dst_name = 3;
  CopyPlanRange dst_range = 4;
}

message CopyPlan {
  uint32 version = 1;
  repeated CopyPlanEntry entries = 2;
}

message MappedTensorSpec {
  string name = 1;
  repeated int64 shape = 2;
  repeated int64 stride = 3;
  string dtype = 4;
  uint64 storage_offset = 5;
  uint64 logical_length = 6;
}

message MaterializeIntoMappedTargetRequest {
  tensorcast.common.v1.ArtifactSelection selection = 1;
  reserved 3;
  reserved "disk_fallback";

  TargetLayout target_layout = 4;
  int32 pid = 5;
  string device_uuid = 6;

  SourcePreference preference = 7;
  SourcePolicy source_policy = 12;

  CopyPlan copy_plan = 8;
  repeated MappedTensorSpec dst_tensors = 9;

  optional string operation_id = 11;
  reserved 2, 10, 1001, 1002;
  reserved "key", "view_subset_hash", "view", "view_id";

  TransformPlacement placement = 1003;
}

message MaterializeIntoTargetRequest {
  tensorcast.common.v1.ArtifactSelection selection = 1;
  reserved 3;
  reserved "disk_fallback";

  TargetLayout target_layout = 4;
  int32 pid = 5;
  string device_uuid = 6;

  SourcePreference preference = 7;
  SourcePolicy source_policy = 12;

  optional string operation_id = 10;
  reserved 2, 8, 9, 1001, 1002;
  reserved "key", "tensor_names", "view_subset_hash", "view", "view_id";

  TransformPlacement placement = 1003;
}

message MaterializeIntoTargetResponse {
  string artifact_id = 1;
  MaterializeReplicaStatus status = 2;
  MaterializationSource source = 3;
  bytes canonical_index_bytes = 4;
  ViewSubset view_subset = 5;
  bytes view_index_bytes = 6;
  uint64 generation = 7;
  bytes target_write_token = 8;
  tensorcast.common.v1.ArtifactSelection resolved_selection = 9;
}

message ConfirmReplicaRequest {
  string disk_path = 1;
  string replica_uuid = 2;
  DeviceType target_device_type = 3;
}

message ConfirmReplicaResponse {
  string disk_path = 1;
  int32 code = 2;
}

message UnloadReplicaRequest {
  string disk_path = 1;
  string replica_uuid = 2;
  DeviceType target_device_type = 3;
  optional int32 pid = 4; // Process ID for reference tracking
  optional string version = 5; // Artifact version
}

message UnloadReplicaResponse {
  string disk_path = 1;
  int32 code = 2;
}

message ClearMemRequest {}

message ClearMemResponse {}

// 获取Worker状态
message GetWorkerStatusRequest {}

message GetWorkerStatusResponse {
  bool is_registered = 1; // 是否已注册到Global Store
  bool is_healthy = 2; // 是否健康运行
  bool is_shutting_down = 3; // 是否正在关闭
  uint64 mem_pool_total_size = 4; // 内存池总大小（字节）
  uint64 mem_pool_available_size = 5; // 内存池可用大小（字节）
  int64 uptime_seconds = 6; // 运行时间（秒）
  string worker_id = 7; // Worker ID（如已注册）
  string daemon_id = 8; // Stable daemon identity (from daemon config)
}

// ----------------------------------------------------------------------
// Verification related definitions
// ----------------------------------------------------------------------

enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_IN_PROGRESS = 1;
  VERIFICATION_STATUS_PASSED = 2;
  VERIFICATION_STATUS_FAILED = 3;
}

message WaitReplicaVerificationRequest {
  string artifact_id = 1;
  string replica_uuid = 2;
  uint32 timeout_ms = 3;
}

message WaitReplicaVerificationResponse {
  VerificationStatus status = 1;
  string err_msg = 2;
}

// ========== 详细状态查询相关定义 ==========

// 驻留位置枚举（保持枚举值兼容）
enum MemoryLocation {
  MEMORY_LOCATION_UNSPECIFIED = 0;
  MEMORY_LOCATION_DISK = 1;
  MEMORY_LOCATION_PAGEABLE_CPU = 2;
  MEMORY_LOCATION_GPU = 3;
  MEMORY_LOCATION_REMOTE = 4;
}

// Replica 信息（单台机器视角）
message ReplicaInfo {
  string artifact_id = 1; // Artifact 标识符
  int64 artifact_size_bytes = 2; // Artifact 大小（字节）
  MemoryLocation location = 3; // 当前位置（CPU/GPU）
  int64 loaded_timestamp = 4; // 加载时间戳
  int64 last_access_timestamp = 5; // 最后访问时间戳
  repeated string replica_uuids = 6; // 关联的副本UUIDs
  bool is_registered_for_comm = 7; // 是否已注册用于RDMA通信
}

// GPU设备信息
message GpuDeviceInfo {
  int32 device_id = 1; // GPU设备ID
  string device_uuid = 2; // GPU设备UUID
  int64 total_memory_bytes = 3; // 总显存（字节）
  int64 free_memory_bytes = 4; // 可用显存（字节）
  int64 used_memory_bytes = 5; // 已使用显存（字节）
  repeated ReplicaInfo loaded_replicas = 6; // 该 GPU 上的 Replica 列表
}

// 内存池信息
message MemoryPoolInfo {
  int64 total_size_bytes = 1; // 内存池总大小
  int64 available_bytes = 2; // 可用大小
  int64 allocated_bytes = 3; // 已分配大小
  int32 allocated_chunks_count = 4; // 已分配的块数
  int64 chunk_size_bytes = 5; // 块大小
}

// RDMA通信信息
message CommunicationInfo {
  bool enabled = 1; // 是否启用RDMA
  int64 total_transfers = 2; // 总传输次数
  int64 total_bytes_transferred = 3; // 总传输字节数
  int64 total_transfer_errors = 4; // 传输错误次数
}

// 详细状态请求
message GetDetailedStatusRequest {}

// 详细状态响应（Artifact/Replica 统一命名）
message GetDetailedStatusResponse {
  // 基础状态信息（与GetWorkerStatusResponse相同的字段）
  bool is_registered = 1;
  bool is_healthy = 2;
  bool is_shutting_down = 3;
  int64 uptime_seconds = 4;
  string worker_id = 5;

  // 内存池详细信息
  MemoryPoolInfo memory_pool_info = 6;

  // GPU 设备列表及其上的 Replica
  repeated GpuDeviceInfo gpu_devices = 7;

  // CPU 内存中的 Replica 列表
  repeated ReplicaInfo cpu_replicas = 8;

  // RDMA/通信信息
  CommunicationInfo communication_info = 9;

  // 聚合统计信息
  int32 total_replicas_loaded = 10; // 已加载 Replica 数
  int64 total_artifact_size_bytes = 11; // 所有 Artifact 总大小

  // 配置信息
  string storage_path = 12; // 存储路径
  int32 num_worker_threads = 13; // 工作线程数
}

// ========== Replica 引用信息查询 ==========

// 单个 Artifact 的引用信息
message LoadedReplicaInfo {
  string artifact_id = 1; // Artifact ID
  string version = 2; // 模型版本
  int32 device_id = 3; // 设备ID (-1 表示CPU)
  int32 ref_count = 4; // 引用计数
  repeated int32 pids = 5; // 持有引用的进程ID列表
  int64 size_bytes = 6; // Artifact 大小（字节）
  google.protobuf.Timestamp last_access_ts = 8; // 标准时间戳
}

// 获取已加载 Replica 请求
// Legacy GetLoadedReplicas removed in favor of V2

message GetLoadedReplicasV2Request {
  // Filters
  optional string artifact_id_filter = 1;
  optional int32 device_id_filter = 2;
  tensorcast.common.v1.Pagination pagination = 100;
}

message GetLoadedReplicasV2Response {
  repeated LoadedReplicaInfo replicas = 1;
  tensorcast.common.v1.PageInfo page_info = 2;
}

// ========== Chunk locking message definitions ==========

// Lock chunks request
message LockTransportChunksRequest {
  string artifact_id = 1; // Artifact ID
  repeated uint32 chunk_indices = 2; // List of chunk indices to lock
  // Optional explicit device id to disambiguate when an artifact has replicas
  // on multiple GPUs. When absent, the daemon attempts to infer a unique
  // device from residency; if ambiguous, the RPC returns INVALID_ARGUMENT.
  optional int32 device_id = 3;
  // Optional TTL extension hint (milliseconds) applied to active leases if granted.
  optional uint32 extend_ttl_ms = 4;
  tensorcast.common.v1.ByteSpaceRef byte_space = 5;
}

// Lock chunks response
message LockTransportChunksResponse {
  string lock_token = 1; // Lock token (UUID)
  // Optional: When source is a LIP (Lease-In-Place) replica, the daemon may
  // attach lightweight verification metadata (JSON) to aid receivers in
  // post-transfer validation (e.g., KEY_POINTS first/middle/last values).
  // Receivers are encouraged to verify at least key points and may upgrade to
  // segment-level verification when available.
  optional string verification_json = 2;
}

// Unlock chunks request
message UnlockTransportChunksRequest {
  string lock_token = 1; // Lock token
}

// Unlock chunks response
message UnlockTransportChunksResponse {
  // Empty response, returns empty message on success
}

// ========== Memory Artifact Registration Messages ==========

// Begin registration request
message BeginRegisterArtifactRequest {
  int32 device_id = 1; // Target GPU device ID
  uint64 total_size = 2; // Total size in bytes (8-byte aligned)
  optional uint32 ttl_ms = 3; // TTL for registration (milliseconds), used by Lease
  int32 owner_pid = 6; // REQUIRED: Owner process ID for lease lifecycle (must be > 0)
  string client_artifact_id = 1002; // Optional client-provided artifact identity (cgid:...)

  // Tensor index can be provided as key or data
  oneof index {
    string tensor_index_key = 4; // SHA-256 hash of canonical index bytes
    TensorIndexData tensor_index_data = 5; // Full canonical index bytes (CBOR/JSON)
  }

  // Realization plan options
  oneof plan {
    CoalescedOptions coalesced = 10;
    LeaseOptions lease = 12;
    StableDramOptions stable_dram = 13;
  }

  StorePolicy policy = 14;

  ViewRegistrationOptions view = 1001;
}

// Tensor index data with metadata
message TensorIndexData {
  bytes data = 1; // Canonical index bytes (CBOR preferred; strict canonical JSON allowed)
  string schema_version = 2; // Schema version (must be "v3")
  string encoding = 3; // Encoding format ("cbor" or "json")
}

message CoalescedOptions {
  uint64 max_inflight_bytes = 1;
  bool release_on_tensor_commit = 2;
}

message LeaseOptions {
  uint64 min_tensor_bytes = 1;
  uint32 max_tensor_count = 2;
  uint64 lease_bytes_limit = 3; // 0 = daemon policy
  bool in_place = 4; // When true, Commit registers an in-place lease (LIP)
}

message StableDramOptions {
  bool stage_on_gpu = 1;
  bool release_gpu_on_commit = 2;
}

// Begin registration response
message BeginRegisterArtifactResponse {
  string registration_id = 1; // Registration ID for subsequent calls
  int32 device_id = 2; // Confirmed device ID
  uint64 total_size = 3; // Confirmed total size
  oneof handshake {
    CoalescedHandshake coalesced = 10;
    LeaseHandshake lease = 12;
    StableDramHandshake stable_dram = 13;
  }
}

message CoalescedHandshake {
  bytes daemon_ipc_handle = 1;
}

message LeaseHandshake {}

message StableDramHandshake {
  bytes staging_cuda_ipc_handle = 1;
  CpuMemfdHandle publish_cpu_memfd = 2;
  bytes publish_cpu_memfd_lease_token = 3;
}

// Stream variants must not reuse unary messages per lint
message FeedRegisterArtifactStreamRequest {
  string registration_id = 1;
  oneof feed {
    LeaseSegments lease_segments = 11;
    ViewUploadChunk view_chunk = 12;
    StableDramWriteProgress stable_dram_write_progress = 13;
  }
  // Optional deduplicated storage table and tensor alias metadata. Clients send
  // these fields when using the unified registration flow; legacy clients omit them.
  repeated StorageEntry storage_entries = 20;
  repeated TensorAlias tensor_aliases = 21;
}
message FeedRegisterArtifactStreamResponse {}

message ViewUploadChunk {
  uint64 canonical_offset = 1;
  uint64 view_offset = 2;
  bytes data = 3;
}

message StableDramWriteProgress {
  repeated StableDramWrittenRange ranges = 1;
  bool upload_complete = 2;
}

message StableDramWrittenRange {
  uint64 canonical_offset = 1;
  uint64 length = 2;
}

message LeaseSegments {
  repeated LeasedSegment segments = 1;
}
message LeasedSegment {
  // Physical storage backing this segment (must match a StorageEntry.storage_id).
  string storage_id = 1;
  // Byte offset within the referenced storage window where this segment begins.
  uint64 storage_offset = 2;
  // Logical byte offset within the artifact where this segment begins.
  // This offset defines LIP's logical segment base and must obey artifact_chunk_bytes alignment rules.
  uint64 artifact_offset = 3;
  // Length of this segment in bytes.
  uint64 length = 4;
}

message StorageEntry {
  string storage_id = 1;
  int32 device_id = 2;
  // Length of this storage window in bytes.
  uint64 storage_length = 3;
  oneof storage_source {
    // CUDA IPC handle for the allocation base pointer that backs this storage.
    bytes cuda_ipc_handle = 4;
    string vram_region_id = 5;
  }
  // Byte offset from the mapped base pointer (allocation base for cuda_ipc_handle, region base for vram_region_id)
  // to the start of this storage window.
  uint64 mapping_base_offset = 6;
}

message TensorAlias {
  string name = 1;
  string storage_id = 2;
  uint64 storage_offset = 3;
  uint64 logical_length = 4;
  repeated int64 shape = 5;
  repeated int64 stride = 6;
  string dtype = 7;
}

// Keep alive for lease lifecycle
message KeepAliveRegisterArtifactRequest {
  string registration_id = 1;
  uint32 ttl_ms = 2;
  uint64 epoch = 3;
  int32 owner_pid = 4; // REQUIRED: must equal Begin.owner_pid
}
message KeepAliveRegisterArtifactResponse {}

// Commit registration request
message CommitRegisteredArtifactRequest {
  string registration_id = 1; // Registration ID from Begin
}

enum LocalStableTierStatus {
  LOCAL_STABLE_TIER_STATUS_UNSPECIFIED = 0;
  LOCAL_STABLE_TIER_STATUS_READY = 1;
  // Requested as `should` but could not be satisfied.
  LOCAL_STABLE_TIER_STATUS_DEGRADED = 2;
  // Not requested by the resolved policy (or requested only as `may`).
  LOCAL_STABLE_TIER_STATUS_SKIPPED = 3;
}

message LocalStableTierResult {
  LocalStableTierStatus status = 1;
  optional string message = 2;
}

// Artifact descriptor conveying content-addressed identity and related metadata
// Commit registration response
message CommitRegisteredArtifactResponse {
  // Content-addressed artifact descriptor (RFC-0007)
  tensorcast.common.v1.ArtifactDescriptor artifact_descriptor = 1;
  // Idempotency indicator: true when the replica already existed on the same
  // device and the daemon returned the existing descriptor while joining a
  // lightweight reference for this registration. See docs/internals/model-loading.md.
  bool existed = 2;
  string view_id = 1001;
  bytes view_index_json = 1002;
  string view_data_hash = 1003;
  repeated CanonicalRange canonical_ranges = 1004;
  bool allow_partial = 1005;

  optional LocalStableTierResult local_stable_tier = 2000;
}

// Abort registration request
message AbortRegisteredArtifactRequest {
  string registration_id = 1; // Registration ID to abort
}

// Abort registration response
message AbortRegisteredArtifactResponse {}

// Revoke registration (lease only)
message RevokeRegisteredArtifactRequest {
  string registration_id = 1;
  string reason = 2;
}
message RevokeRegisteredArtifactResponse {}

message RegisterVramRegionRequest {
  // Client session identifier (best-effort) used for diagnostics and ownership.
  optional string session_id = 1;
  int32 device_id = 2;
  bytes cuda_ipc_handle = 3;
  uint64 size_bytes = 4;
  uint32 ttl_ms = 5;
  int32 owner_pid = 6;
  // Optional human-readable tag for operator diagnostics.
  optional string region_name = 7;
}

message RegisterVramRegionResponse {
  string region_id = 1;
  uint32 ttl_ms = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message UnregisterVramRegionRequest {
  optional string session_id = 1;
  string region_id = 2;
  int32 owner_pid = 3;
  // When true, the daemon attempts best-effort release even if TTL expired.
  optional bool force = 4;
}

message UnregisterVramRegionResponse {
  bool released = 1;
}

message DeregisterArtifactRequest {
  string artifact_id = 1;
  optional string session_id = 2;
  // When true, the daemon blocks until all active staged exports drain or timeout.
  bool wait_for_drain = 3;
  // Drain timeout in milliseconds; 0 uses daemon policy.
  optional uint32 drain_timeout_ms = 4;
  // Optional lease TTL extension applied before entering quiesce.
  optional uint32 extend_ttl_ms = 5;
  // Optional owner PID verification.
  optional int32 owner_pid = 6;
  // Optional explicit device identifier when replicas span devices.
  optional int32 device_id = 7;
  // When true, release region references once deregistration completes.
  optional bool release_regions = 8;
  tensorcast.common.v1.ByteSpaceRef byte_space = 9;
  optional string operation_id = 10;
  // When true, keep any managed shared-disk copies (default: purge on deregister).
  optional bool keep_shared_disk_copy = 11;
}

message DeregisterArtifactResponse {
  bool drained = 1;
  bool removed = 2;
  repeated string released_region_ids = 3;
  optional string message = 4;
}

message PublishTargetReplicaRequest {
  bytes target_write_token = 1;
  tensorcast.common.v1.ByteSpaceRef byte_space = 2;
  optional uint32 ttl_ms = 3;
  optional int32 owner_pid = 4;
  optional string operation_id = 5;
}

message PublishTargetReplicaResponse {
  string lease_id = 1;
  string replica_id = 2;
}

message RetirePublishedReplicaRequest {
  optional string lease_id = 1;
  string artifact_id = 2;
  tensorcast.common.v1.ByteSpaceRef byte_space = 3;
  optional int32 owner_pid = 4;
  optional int32 device_id = 5;
  bool wait_for_drain = 6;
  optional uint32 drain_timeout_ms = 7;
  optional string operation_id = 8;
}

message RetirePublishedReplicaResponse {
  bool drained = 1;
  bool removed = 2;
  optional string message = 3;
}

message ImportArtifactFromPathRequest {
  string path = 1;
  bool verify_checksums = 2;
}

enum ImportArtifactState {
  IMPORT_ARTIFACT_STATE_UNSPECIFIED = 0;
  IMPORT_ARTIFACT_STATE_READY = 1;
}

message ImportArtifactFromPathResponse {
  string artifact_id = 1;
  bytes canonical_index_bytes = 2;
  uint64 generation = 3;
  ImportArtifactState import_state = 4;
}

enum ImportArtifactPhase {
  IMPORT_ARTIFACT_PHASE_UNSPECIFIED = 0;
  IMPORT_ARTIFACT_PHASE_PREPARE = 1;
  IMPORT_ARTIFACT_PHASE_SCAN_SOURCE = 2;
  IMPORT_ARTIFACT_PHASE_READ_HEADERS = 3;
  IMPORT_ARTIFACT_PHASE_BUILD_CANONICAL_INDEX = 4;
  IMPORT_ARTIFACT_PHASE_HASH_DATA = 5;
  IMPORT_ARTIFACT_PHASE_WRITE_REGISTRY = 6;
  IMPORT_ARTIFACT_PHASE_DONE = 7;
  IMPORT_ARTIFACT_PHASE_ERROR = 8;
}

enum ImportArtifactErrorCode {
  IMPORT_ARTIFACT_ERROR_CODE_UNSPECIFIED = 0;
  IMPORT_ARTIFACT_ERROR_CODE_SOURCE_NOT_FOUND = 1;
  IMPORT_ARTIFACT_ERROR_CODE_SOURCE_PERMISSION_DENIED = 2;
  IMPORT_ARTIFACT_ERROR_CODE_SOURCE_FORMAT_INVALID = 3;
  IMPORT_ARTIFACT_ERROR_CODE_SOURCE_MUTATED = 4;
  IMPORT_ARTIFACT_ERROR_CODE_REGISTRY_IO_FAILURE = 5;
  IMPORT_ARTIFACT_ERROR_CODE_POLICY_DENIED_NON_LOCAL_PEER = 6;
}

message ImportArtifactFromPathStreamEvent {
  uint64 seq = 1;
  ImportArtifactPhase phase = 2;
  uint64 processed_bytes = 3;
  uint64 total_bytes = 4;
  double percent = 5;
  bool done = 6;
  bool error = 7;
  ImportArtifactErrorCode error_code = 8;
  string message = 9;
  ImportArtifactFromPathResponse result = 10;
}

message QueryReplicaStatusResponse {
  ReplicaTicket ticket = 1;
  ReplicaOperationStatus status = 2;
  bytes replica_key_hash = 3;
}

message QueryReplicaStatusRequest {
  ReplicaTicket ticket = 1;
}

message WaitReplicaStatusRequest {
  ReplicaTicket ticket = 1;
  // Server-side wait budget. When unset/0, the server waits until the replica
  // reaches a terminal state or until the RPC deadline expires.
  uint32 timeout_ms = 2;
}

message WaitReplicaStatusResponse {
  ReplicaTicket ticket = 1;
  ReplicaOperationStatus status = 2;
  bytes replica_key_hash = 3;
}

message ReleaseReplicaRequest {
  ReplicaTicket ticket = 1;
}

message ReleaseReplicaResponse {
  bool released = 1;
}

// ========== Placement leases (device residency pins) ==========
message CreatePlacementLeaseRequest {
  string artifact_id = 1;
  string view_id = 2;
  int32 device_id = 3;
  // When unset, the lease is best-effort and remains until explicitly released
  // or daemon restart. When set, the lease is guarded by a deadline.
  optional uint32 ttl_ms = 4;
}

message CreatePlacementLeaseResponse {
  uint64 lease_id = 1;
  bytes lease_token = 2;
  optional google.protobuf.Timestamp expires_at = 3;
}

message RenewPlacementLeaseRequest {
  bytes lease_token = 1;
  uint32 ttl_ms = 2;
}

message RenewPlacementLeaseResponse {
  uint64 lease_id = 1;
  optional google.protobuf.Timestamp expires_at = 2;
  bytes lease_token = 3;
}

message ReleasePlacementLeaseRequest {
  bytes lease_token = 1;
}

message ReleasePlacementLeaseResponse {
  bool released = 1;
}

// ========== Retention handles ==========
message RetentionHandle {
  string handle_id = 1;
  uint64 expires_at_ms = 2;
  bytes capability_token = 3;
  uint64 charged_bytes = 4;
  string diagnostics = 5;
}

message AcquireRetentionHandleRequest {
  tensorcast.common.v1.ArtifactSelection selection = 1;
  StorePolicy policy = 2;
  uint64 ttl_ms = 3;
}

message AcquireRetentionHandleResponse {
  RetentionHandle handle = 1;
}

message RenewRetentionHandleRequest {
  bytes handle_token = 1;
  uint64 extend_ttl_ms = 2;
}

message RenewRetentionHandleResponse {
  RetentionHandle handle = 1;
}

message ReleaseRetentionHandleRequest {
  bytes handle_token = 1;
}

message ReleaseRetentionHandleResponse {
  bool released = 1;
}

message PublishReplicaKeyRequest {
  string key = 1;
  // Content-addressed artifact descriptor (RFC-0007)
  tensorcast.common.v1.ArtifactDescriptor artifact_descriptor = 2;
  string replica_uuid = 3;
  reserved 4;
  reserved "disk_path";
  bool fail_if_exists = 5; // default semantics: true
}
message PublishReplicaKeyResponse {
  bool ok = 1;
  string conflict_reason = 2;
}

// Key mapping helpers exposed via daemon to keep API clients decoupled from Global Store.
message ResolveKeyMappingRequest {
  string key = 1;
}
message ResolveKeyMappingResponse {
  string artifact_id = 1;
  reserved 2;
  reserved "used_disk_path";
  uint64 generation = 3;
  uint32 cache_ttl_seconds = 4;
}

message SwapKeyMappingRequest {
  string key = 1;
  string new_artifact_id = 2;
  string expected_artifact_id = 3;
  optional uint64 expected_generation = 4;
  string operation_id = 5;
}
message SwapKeyMappingResponse {
  bool ok = 1;
  string artifact_id = 2;
  uint64 generation = 3;
}

message GetArtifactIndexByIdRequest {
  string artifact_id = 1;
}
message GetArtifactIndexByIdResponse {
  bytes tensor_index_data = 1;
}

message SealAssemblyRequest {
  string assembly_id = 1;
  bool publish_canonical = 2;
}

message SealAssemblyResponse {
  string sealed_artifact_id = 1;
  tensorcast.common.v1.ArtifactDescriptor descriptor = 2;
  bool already_sealed = 3;
}

message SealAssemblyResult {
  tensorcast.common.v1.ArtifactDescriptor artifact = 1;
}

message StartSealAssemblyRequest {
  string assembly_id = 1;
  // Optional explicit layout selection; if absent, sealing uses the current assembly layout binding (if any).
  string layout_id = 2;
}

message StartSealAssemblyResponse {
  tensorcast.operation.v1.OperationRef operation = 1;
}

// Immutable seal snapshot stored inside Operation.snapshot.
message SealAssemblySnapshotView {
  string view_id = 1;
  // Raw 32-byte SHA-256 digest over immutable view metadata (e.g., coverage ranges + view_data_hash).
  bytes meta_digest = 2;
}

message SealAssemblySnapshot {
  string assembly_id = 1;
  string layout_id = 2;
  uint64 assembly_layout_binding_version = 3;
  repeated SealAssemblySnapshotView views = 4;
}

message WaitOperationRequest {
  string operation_id = 1;
  uint64 timeout_ms = 2;
}

message WaitOperationResponse {
  tensorcast.operation.v1.GetOperationResponse operation = 1;
}

// ========== Persistence ==========
message PersistenceShardStatus {
  string shard_id = 1;
  uint32 shard_idx = 2;
  PersistenceState state = 3;
  double progress = 4;
  string degraded_reason = 5;
  string last_error = 6;
  repeated string target_nodes = 7;
  repeated string lease_ids = 8;
}

message StartPersistenceRequest {
  string artifact_id = 1;
  StorePolicy policy = 2;
  reserved 3;
  reserved "placement_policy", "persist_to_shared_disk";
  string key_hint = 4;
}

message StartPersistenceResponse {
  string task_id = 1;
  string plan_id = 2;
  PersistenceState state = 3;
  double progress = 4;
  string degraded_reason = 5;
}

message QueryPersistenceStatusRequest {
  string task_id = 1;
  string artifact_id = 2;
}

message QueryPersistenceStatusResponse {
  string task_id = 1;
  string artifact_id = 2;
  string plan_id = 3;
  PersistenceState state = 4;
  double progress = 5;
  string degraded_reason = 6;
  string last_error = 7;
  repeated PersistenceShardStatus shards = 8;
}

message WaitPersistenceStatusRequest {
  string task_id = 1;
  // Server-side wait budget. When unset/0, the server waits until the task
  // reaches a terminal state or until the RPC deadline expires.
  uint32 timeout_ms = 2;
}

message WaitPersistenceStatusResponse {
  QueryPersistenceStatusResponse status = 1;
}
