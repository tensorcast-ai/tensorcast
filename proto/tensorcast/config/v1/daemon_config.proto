syntax = "proto3";

package tensorcast.config.v1;

import "google/protobuf/duration.proto";
import "tensorcast/communicator/v1/communicator_config.proto";
import "tensorcast/config/v1/common.proto";

// Verification timeout behavior when confirming replicas.
enum VerificationTimeoutStatus {
  VERIFICATION_TIMEOUT_STATUS_UNSPECIFIED = 0;
  VERIFICATION_TIMEOUT_STATUS_OK = 1;
  VERIFICATION_TIMEOUT_STATUS_DEADLINE = 2;
}

enum PromotionPolicy {
  PROMOTION_POLICY_UNSPECIFIED = 0;
  PROMOTION_POLICY_NEVER = 1;
  PROMOTION_POLICY_ON_MATERIALIZE = 2;
  PROMOTION_POLICY_ON_HOTNESS = 3;
  PROMOTION_POLICY_ON_POLICY = 4;
}

// Explicit daemon server config to avoid ambiguity with other servers.
message DaemonServer {
  // Legacy fields replaced by listen/p2p_listen for structure.
  reserved 1, 2, 5; // host, port, p2p_port
  reserved "host", "port", "p2p_port";
  tensorcast.config.v1.SocketAddress listen = 10;
  // Optional externally advertised address. If unset or set to an
  // unspecified/loopback host, the daemon attempts to auto-detect a
  // routable non-loopback IPv4 address during Global Store registration.
  // If auto-detection fails, startup aborts with INVALID_ARGUMENT asking for
  // a routable advertise.host.
  // The port field is currently ignored for gRPC registration; the
  // gRPC port is taken from `listen.port`.
  tensorcast.config.v1.SocketAddress advertise = 12;
  string storage_path = 3;
  uint32 num_threads = 4;
  // Field 6 was enable_p2p_access; removed to avoid duplication with communicator.enable_rdma
  reserved 6;
  // Optional dedicated P2P listen address. If unset, defaults to listen.host with a configured port.
  tensorcast.config.v1.SocketAddress p2p_listen = 11;
  tensorcast.config.v1.GrpcServer grpc = 7;
}

message Lifecycle {
  double gpu_memory_limit_fraction = 1;
  google.protobuf.Duration eviction_check_interval = 2;
  google.protobuf.Duration proc_check_interval = 3;
  google.protobuf.Duration sessions_sweep_interval = 4;
  google.protobuf.Duration locks_sweep_interval = 5;
  google.protobuf.Duration verification_sweep_interval = 6;
  // Replaced by proc_check_interval to avoid duplicate process scanning intervals.
  reserved 7; // pid_watch_interval
  google.protobuf.Duration sessions_ttl = 8;
  google.protobuf.Duration locks_ttl = 9;
  bool enable_periodic_eviction = 10;
  // If unset, service uses a conservative default (1s).
  google.protobuf.Duration eviction_loop_interval = 11;

  message HandleLeases {
    // Unix domain socket path for local handle plane (FD handoff + lease release).
    // When empty, the local handle plane is disabled and the daemon will not issue
    // handle leases (MemCopyHandle.lease_token).
    string local_handle_socket_path = 1;
    // TTL for handle leases issued by the daemon (best-effort crash safety).
    // When unset or set to 0s, TTL is disabled and handle leases rely on explicit release and PID-exit cleanup.
    google.protobuf.Duration ttl = 2;
    // Best-effort guardrail: limit lease-bearing handle mints per second (0 => unlimited).
    uint32 max_mints_per_second = 3;
  }
  HandleLeases handle_leases = 20;
}

message HighAvailability {
  bool enabled = 1;
  reserved 2; // global_store_address (host:port string)
  reserved 11, 13, 14;
  reserved "force_full_sync_on_empty_inventory", "full_sync_rpc_timeout", "full_sync_rpc_max_retries";
  // One or more control-plane endpoints for the Global Store.
  repeated tensorcast.config.v1.SocketAddress global_store_endpoints = 10;
  google.protobuf.Duration heartbeat_interval = 3;
  google.protobuf.Duration periodic_sync_interval = 4;
  int32 max_retries = 5;
  google.protobuf.Duration registration_retry_delay = 6;
  // Heartbeat RPC policy overrides (0/absent => use GlobalStoreClient defaults).
  google.protobuf.Duration heartbeat_rpc_timeout = 7;
  optional int32 heartbeat_rpc_max_retries = 8;
  // State sync RPC policy overrides (0/absent => use GlobalStoreClient defaults).
  google.protobuf.Duration state_sync_rpc_timeout = 9;
  optional int32 state_sync_rpc_max_retries = 12;
}

message Engine {
  reserved 1, 2, 4, 5;
  reserved "mem_pool_size_bytes", "tx_slice_bytes", "streaming_buffer_max_concurrent_sessions", "pinned_allocation_timeout";
  // Renamed: cpu_chunk_size_bytes -> artifact_chunk_bytes (field number unchanged)
  uint64 artifact_chunk_bytes = 3;

  message CpuSharedMemory {
    // When enabled, UMA CPU allocations are backed by memfd + MAP_SHARED so they
    // can be exported cross-process for zero-copy CPU tensor materialization.
    bool enabled = 1;
  }
  CpuSharedMemory cpu_shared_memory = 11;

  message MemoryTiers {
    // When false, UMA will operate in stable-only mode and skip preemptible markings.
    bool enable_preemptible = 1;
    // Minimum stable CPU bytes reserved for UMA-managed artifacts (after subtracting pinned pool).
    uint64 stable_bytes = 2;
    // Optional cap for preemptible pool. Ignored when enable_preemptible=false.
    uint64 preemptible_limit_bytes = 3;
    // Low watermark ratio used by preemptible pressure loop.
    double preemptible_low_watermark_ratio = 4;
  }
  // Reserve legacy identifiers to avoid accidental reuse
  reserved "chunk_bytes", "cpu_chunk_size_bytes";
  // Depth (in slices) for engine-owned StreamingPinnedBuffer instances used for
  // streaming CPU<->GPU transfers and disk/p2p pipelines.
  uint32 streaming_buffer_chunks = 8;
  // When true, MaterializeIntoTarget verifies external target writes against
  // expected data hashes (content-addressed or view metadata).
  bool enable_external_target_verification = 12;
  reserved 6, 7;
  reserved "p2p_fallback_disk_dir", "disk_path_whitelist";
  MemoryTiers memory_tiers = 10;

  message ByteMapping {
    optional bool enable_strided_execution = 1;
    optional bool enable_direct_write_at = 2;
    uint32 program_cache_entries = 3;
    uint32 strided_run_min_ranges = 4;
    uint64 strided_min_row_len_bytes = 5;
    uint32 strided_max_amplification = 6;
    uint64 strided_block_target_bytes = 7;
    uint64 strided_block_max_bytes = 8;
    optional bool disk_source_ordered_read = 9;
    uint64 disk_source_merge_max_gap_bytes = 10;
    uint32 disk_source_merge_max_amplification = 11;
    uint32 disk_source_prefetch_depth = 12;
  }
  ByteMapping byte_mapping = 13;
}

message Promotion {
  PromotionPolicy policy = 1;
  bool require_verified = 2;
  google.protobuf.Duration demotion_drain_timeout = 3;
  // Max concurrent transport requests allowed per registered memory replica in
  // Global Store. Set to 1 to force per-replica P2P serialization.
  uint32 max_concurrency = 4;
}

message PinnedMemory {
  message PinnedClass {
    string name = 1;
    uint64 slice_bytes = 2;
    // Phase 1 fixed-allocation: pool_bytes is the full preallocated capacity
    // for the class. Total pinned reservation is derived as sum(classes[].pool_bytes).
    uint64 pool_bytes = 3;
    reserved 4;
    reserved "min_bytes", "max_bytes";
    bool rdma_preregister = 5;
  }

  reserved 1;
  reserved "total_bytes";
  google.protobuf.Duration allocation_timeout = 2;
  repeated PinnedClass classes = 3;
}

message DaemonConfig {
  DaemonServer server = 1;
  Lifecycle lifecycle = 2;
  HighAvailability high_availability = 3;
  tensorcast.communicator.v1.CommunicatorConfig communicator = 4;
  Engine engine = 5;
  tensorcast.config.v1.Observability observability = 6;
  Promotion promotion = 25;
  // Stable identity for this daemon instance used by the control plane.
  // Must not be derived from network address and should remain stable across restarts.
  string daemon_id = 10;
  // Launcher-only environment variables applied by the CLI/SDK when spawning
  // the daemon binary. These values must be declared explicitly in config; the
  // daemon does not read ambient process environment as part of the unified
  // runtime configuration contract.
  //
  // Special case: when LD_LIBRARY_PATH is configured here, the launcher keeps
  // inherited entries first, then appends the configured entries, then appends
  // TensorCast/PyTorch/CUDA library directories discovered from the active
  // Python environment.
  map<string, string> envs = 26;

  message Compatibility {
    bool confirm_requires_disk_path = 1;
    VerificationTimeoutStatus verification_timeout_status = 2;
    bool evict_on_dead_pid = 3;
    bool auto_register_disk_loads = 4;
    bool force_full_digest_on_load = 5;
  }
  Compatibility compatibility = 7;

  message CapabilityTokens {
    message Key {
      uint32 version = 1;
      bytes secret = 2;
    }
    Key active = 1;
    repeated Key previous = 2;
  }
  CapabilityTokens capability_tokens = 22;

  message RetentionHandles {
    bool enabled = 1;
    google.protobuf.Duration default_ttl = 2;
    google.protobuf.Duration max_ttl = 3;
  }
  RetentionHandles retention_handles = 23;

  message CapabilityDirectory {
    bool enabled = 1;
    optional bool gateway_ingress_enabled = 2;
    optional bool shard_home_eligible = 3;
  }
  CapabilityDirectory capability_directory = 24;

  reserved 8;
  reserved "checkpoint";
  PinnedMemory pinned_memory = 20;

  message PostSealPolicy {
    // When true, migrate selected assembly views under the sealed mi2_id.
    bool migrate_views = 1;
    // When true, only migrate views that require transforms (e.g., transpose).
    bool migrate_transpose_only = 2;
    // When true, allow safe reuse of CGID-scoped view replicas after sealing.
    bool reuse_views_if_safe = 3;
    // When true, retire CGID-scoped piece replicas after sealing.
    bool retire_pieces = 4;
  }
  PostSealPolicy post_seal = 21;

  message Debug {
    message Cuda {
      bool enable_same_process_ipc_fallback = 1;
    }
    Cuda cuda = 1;
  }
  Debug debug = 9;

  message ByteArtifactRouting {
    message PayloadTransport {
      google.protobuf.Duration ref_ttl = 1;
      uint64 max_chunk_bytes = 2;
      google.protobuf.Duration fetch_deadline = 3;
      google.protobuf.Duration cleanup_interval = 4;
      // Max slab size for a single batch payload transport object.
      uint64 max_batch_payload_bytes = 5;
      // Max artifact count packed into one batch payload transport object.
      uint32 max_batch_items = 6;
      // Best-effort cap for locally staged batch slabs per remote peer.
      uint64 max_batch_stage_bytes_per_peer = 7;
      // 0 disables batch-native payload transport; 1 enables grpc_chunk_ref v1;
      // 2 enables communicator_source v2 with grpc_chunk_ref fallback.
      uint32 batch_transport_protocol_version = 8;
      // Enable communicator_source export for batch-native payload transport.
      bool communicator_source_enabled = 9;
      // Enable host-memory export when serving communicator_source packs.
      bool host_memory_export_enabled = 10;
      // Optional stricter floor for remaining transport TTL at issue time.
      google.protobuf.Duration minimum_batch_transport_ttl = 11;
      // Optional grace window kept after the nominal expiry before release.
      google.protobuf.Duration transport_release_guard = 12;
    }

    // Stable shard count for shard_id derivation.
    uint32 shard_count = 1;
    // Inline payload threshold for HomeBatchGet/puts before payload_ref transport is required.
    uint64 inline_payload_threshold_bytes = 2;
    // Bounded staleness budget for cached shard->holder routes.
    google.protobuf.Duration route_staleness_budget = 3;
    // Shard-home lease TTL requested from Global Store.
    google.protobuf.Duration lease_ttl = 4;
    // Best-effort keepalive interval while holding shard-home leases.
    google.protobuf.Duration keepalive_interval = 5;
    // Staleness budget for daemon_id -> address resolution via worker directory.
    google.protobuf.Duration worker_directory_staleness_budget = 6;
    // Cluster-wide compatibility epoch/fingerprint for routed byte-artifact semantics.
    uint64 routing_epoch = 7;
    PayloadTransport payload_transport = 8;
  }
  ByteArtifactRouting byte_artifact_routing = 30;

  // Optional metadata for auditing/versioning
  tensorcast.config.v1.ConfigMeta meta = 100;
}
