syntax = "proto3";

package tensorcast.config.v1;

import "google/protobuf/duration.proto";
import "tensorcast/config/v1/common.proto";

message NodeAgentServer {
  tensorcast.config.v1.SocketAddress listen = 1;
  tensorcast.config.v1.GrpcServer grpc = 2;
}

message NodeAgentIdentity {
  string daemon_id = 1;
  string instance_id = 2;
  string engine = 3;
  string worker_id = 4;
  string signals_endpoint = 5;
  map<string, string> labels = 6;
}

message NodeAgentGlobalStore {
  repeated tensorcast.config.v1.SocketAddress endpoints = 1;
  google.protobuf.Duration heartbeat_interval = 2;
  google.protobuf.Duration register_retry_delay = 3;
  optional bool register_instance = 4;
}

message EngineAdapterConfig {
  google.protobuf.Duration target_ttl = 1;
  string capability_secret = 2;
  repeated string transform_plugins = 3;
}

message NodeAgentConfig {
  NodeAgentServer server = 1;
  tensorcast.config.v1.SocketAddress daemon_target = 2;
  NodeAgentIdentity identity = 3;
  NodeAgentGlobalStore global_store = 4;
  EngineAdapterConfig engine_adapter = 5;
  tensorcast.config.v1.Observability observability = 6;
  tensorcast.config.v1.ConfigMeta meta = 100;
}
