syntax = "proto3";

package tensorcast.plan.v1;

import "tensorcast/common/v1/common.proto";

message CallContext {
  string request_id = 1;
  QosClass qos = 2;
  optional uint64 deadline_ms = 3;
  string idempotency_key = 4;
  map<string, string> tags = 5;
}

message GovernanceContext {
  string lane = 1;
  optional uint64 policy_version = 2;
  optional uint64 staleness_budget_ms = 3;
}

enum QosClass {
  QOS_CLASS_UNSPECIFIED = 0;
  QOS_CLASS_REALTIME = 1;
  QOS_CLASS_INTERACTIVE = 2;
  QOS_CLASS_BACKGROUND = 3;
}

enum TargetType {
  TARGET_TYPE_UNSPECIFIED = 0;
  TARGET_TYPE_WORKER = 1;
  TARGET_TYPE_INSTANCE = 2;
  TARGET_TYPE_CLUSTER = 3;
}

enum PolicyProfile {
  POLICY_PROFILE_UNSPECIFIED = 0;
  POLICY_PROFILE_CACHE = 1;
  POLICY_PROFILE_DURABLE = 2;
  POLICY_PROFILE_HA = 3;
  POLICY_PROFILE_COLD = 4;
  POLICY_PROFILE_PINNED = 5;
  POLICY_PROFILE_WARM = 6;
}

enum PolicyTier {
  POLICY_TIER_UNSPECIFIED = 0;
  POLICY_TIER_STABLE_DRAM = 1;
  POLICY_TIER_SHARED_DISK = 2;
}

enum PolicyScope {
  POLICY_SCOPE_UNSPECIFIED = 0;
  POLICY_SCOPE_LOCAL = 1;
  POLICY_SCOPE_REMOTE = 2;
  POLICY_SCOPE_ANY = 3;
}

enum RetentionPolicy {
  RETENTION_POLICY_UNSPECIFIED = 0;
  RETENTION_POLICY_BEST_EFFORT = 1;
  RETENTION_POLICY_TTL = 2;
  RETENTION_POLICY_PINNED = 3;
}

enum OverflowPolicy {
  OVERFLOW_POLICY_UNSPECIFIED = 0;
  OVERFLOW_POLICY_EVICT = 1;
  OVERFLOW_POLICY_SPILL = 2;
  OVERFLOW_POLICY_REJECT = 3;
}

enum PolicyLayout {
  POLICY_LAYOUT_UNSPECIFIED = 0;
  POLICY_LAYOUT_AUTO = 1;
  POLICY_LAYOUT_UNSHARDED = 2;
  POLICY_LAYOUT_SHARDED = 3;
}

message TierSpec {
  PolicyTier tier = 1;
  PolicyScope scope = 2;
  uint32 min_replicas = 3;
  RetentionPolicy retention_policy = 4;
  optional uint64 retention_ttl_ms = 5;
}

message StorePolicy {
  PolicyProfile profile = 1;
  repeated TierSpec must = 2;
  repeated TierSpec should = 3;
  repeated TierSpec may = 4;
  OverflowPolicy overflow_policy = 5;
  PolicyLayout layout = 6;
}

message TargetRef {
  TargetType target_type = 1;
  string target_id = 2;
}

message PrefetchAction {
  tensorcast.common.v1.ArtifactSelection selection = 1;
  int32 device_id = 2;
}

message ArtifactSetRef {
  string set_digest_hex = 1;
  uint64 item_count = 2;
  string carrier_form = 3;
  repeated tensorcast.common.v1.ArtifactSelection inline_items = 4;
  tensorcast.common.v1.ArtifactSelection manifest_selection = 5;
}

message ManifestArtifactSetBridge {
  string bridge_schema = 1;
  uint32 bridge_version = 2;
  ArtifactSetRef artifact_set_ref = 3;
  repeated tensorcast.common.v1.ArtifactSelection resolved_items = 4;
}

message PrefetchSetAction {
  ArtifactSetRef artifact_set = 1;
  int32 device_id = 2;
  ManifestArtifactSetBridge manifest_bridge = 3;
}

message PinDeviceResidencyAction {
  tensorcast.common.v1.ArtifactSelection selection = 1;
  int32 device_id = 2;
  optional uint64 ttl_ms = 3;
}

message UnpinDeviceResidencyAction {
  string pin_id = 1;
  bytes capability_token = 2;
}

message TransformArg {
  string key = 1;
  oneof value {
    string string_value = 2;
    int64 int_value = 3;
  }
}

message TransformSpec {
  string name = 1;
  repeated TransformArg args = 2;
  string layout_hash = 3;
}

message TargetSpec {
  string instance_id = 1;
  string name = 2;
  map<string, string> tensors = 3;
  string layout_hash = 4;
  uint64 expires_at_ms = 5;
  bytes capability_token = 6;
}

message TransformIntoAction {
  tensorcast.common.v1.ArtifactSelection selection = 1;
  TransformSpec spec = 2;
  TargetSpec target = 3;
}

message TransformRegisterAction {
  tensorcast.common.v1.ArtifactSelection selection = 1;
  TransformSpec spec = 2;
  string out_key = 3;
  StorePolicy policy = 4;
}

message ManifestAction {
  // Engine-local correlation handle for adapter inspection.
  // This is compatibility context, not framework artifact or set identity.
  string engine_request_id = 1;
}

message PublishAction {
  // Engine-local correlation handle for adapter inspection.
  // This is compatibility context, not framework artifact or set identity.
  string engine_request_id = 1;
  optional uint64 ttl_ms = 2;
}

message HydrateAction {
  // Engine-local correlation handle for adapter inspection.
  // This is compatibility context, not framework artifact or set identity.
  string engine_request_id = 1;
}

message EvictLocalAction {
  // Engine-local correlation handle for adapter inspection.
  // This is compatibility context, not framework artifact or set identity.
  optional string engine_request_id = 1;
}

message ClusterActionRef {
  string action_ref = 1;
  bytes opaque_payload = 2;
}

message PlanAction {
  oneof kind {
    PrefetchAction prefetch = 1;
    PinDeviceResidencyAction pin_device_residency = 2;
    UnpinDeviceResidencyAction unpin_device_residency = 3;
    TransformIntoAction transform_into = 4;
    TransformRegisterAction transform_register = 5;
    ManifestAction manifest = 6;
    PublishAction publish = 7;
    HydrateAction hydrate = 8;
    EvictLocalAction evict_local = 9;
    PrefetchSetAction prefetch_set = 10;
    ClusterActionRef cluster_action = 11;
  }
}

message PlanStep {
  string step_id = 1;
  TargetRef target = 2;
  PlanAction action = 3;
  repeated string depends_on = 4;
}

message PlanSpec {
  string plan_id = 1;
  CallContext context = 2;
  repeated PlanStep steps = 3;
  GovernanceContext governance = 4;
}
