syntax = "proto3";

package tensorcast.communicator.v1;

// Typed configuration for the communicator engine and staging behavior.

message StagerConfig {
  bool stage_cpu_for_rdma = 1; // default: true
  reserved 2, 3, 7;
  reserved "stage_chunk_mb_cpu", "stage_chunk_mb_gpu", "direct_chunk_mb";
  int32 buffers_per_flow = 4; // default: 4
  uint32 max_window_segments = 5; // default: 0 (auto = buffers_per_flow)
  uint32 expected_gpu_channels = 6; // default: 0 (auto)
}

message RdmaConfig {
  int32 outstanding_wr = 1; // default: 64
  uint32 ack_ttl_ms = 2; // default: 30000
  // RDMA QP tuning
  int32 traffic_class = 3; // default: 186 (TOS)
  int32 qp_timeout = 4; // default: 20
  int32 qp_retry = 5; // default: 7
  // Multi-QP configuration
  int32 qp_count = 6; // default: 1 (single QP), range: 1-16
  bool bonding_balance = 7; // default: false (disable LAG port balancing)
  enum StagedRdmaBackend {
    STAGED_RDMA_BACKEND_UNSPECIFIED = 0; // treated as STAGED_RDMA_BACKEND_HOST_PINNED
    STAGED_RDMA_BACKEND_HOST_PINNED = 1; // stage into host-pinned buffers (default)
    STAGED_RDMA_BACKEND_GPU_VRAM = 2; // stage into GPU VRAM (RDMA-only)
  }
  StagedRdmaBackend staging_backend = 8;
  uint64 vram_pool_bytes_per_gpu = 9;
  uint64 vram_slice_bytes = 10;
  optional bool enable_stable_local_mr_reuse = 11; // default: true
  uint32 stable_local_mr_reuse_chunk_slots = 12; // default: 1
}

message TransportConfig {
  int32 tcp_conn_count = 1; // default: 8
  int32 tcp_tos = 2; // default: 0 (no change)
  int32 connect_timeout_sec = 3; // default: 10
  optional bool so_reuseport = 4; // default: true (Communicator treats unset as true)
}

message AffinityConfig {
  bool enable = 1; // reserved for future CPU pinning
}

message SimpleNumaNode {
  int32 id = 1;
  repeated string nics = 2;
  repeated int32 gpus = 3;
  bool is_default = 4;
}

message SimpleNumaConfig {
  bool enable = 1; // default: false
  repeated SimpleNumaNode nodes = 2;
}

message LldpDiscoveryConfig {
  // LLDP rail mapping file. Example line:
  //   eth1=0000:19:00.0,mlx5_0,1
  // default: /host-config/lldp-info.txt
  string file_path = 1;
  // When true, missing file or parse failures fail fast during topology build.
  // default: false
  bool required = 2;
}

message NvlinkDiscoveryConfig {
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    SOURCE_DISABLED = 1;
    SOURCE_SNAPSHOT_FILE = 2;
    SOURCE_RUNTIME_PROBE = 3;
  }
  // default: SOURCE_DISABLED
  Source source = 1;
  // Used when source == SOURCE_SNAPSHOT_FILE.
  string snapshot_file_path = 2;
  // When true, unavailable NVLINK source fails topology build.
  // default: false
  bool required = 3;
}

message TopologyMergePolicy {
  // Emit per-rail switch endpoints (netsw_rail_<id>).
  // default: true
  bool emit_rail_switch_endpoints = 1;
  // Require full graph connectivity during topology validation.
  // default: false
  bool require_connected = 2;
}

message TopologyDiscoveryConfig {
  // Enable LLDP/NVLINK-based topology discovery.
  // default: false
  bool enable = 1;
  LldpDiscoveryConfig lldp = 2;
  NvlinkDiscoveryConfig nvlink = 3;
  TopologyMergePolicy merge_policy = 4;
}

message CommunicatorConfig {
  bool enable_rdma = 1; // default: false
  StagerConfig stager = 2;
  RdmaConfig rdma = 3;
  reserved 4;
  reserved "pool";
  TransportConfig transport = 5;
  AffinityConfig affinity = 6;
  SimpleNumaConfig simple_numa = 7; // optional; mirrors env-based interim
  TopologyDiscoveryConfig topology_discovery = 8;
}
