syntax = "proto3";

package tensorcast.global_store.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "tensorcast/common/v1/common.proto";
import "tensorcast/layout/v1/layout.proto";
import "tensorcast/operation/v1/operation.proto";

// Runtime state domain: workers/instances/replicas/transports/chunks and HA sync.
service ClusterRuntimeService {
  // Worker management
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse) {}
  rpc WorkerHeartbeat(WorkerHeartbeatRequest) returns (WorkerHeartbeatResponse) {}
  rpc UnregisterWorker(UnregisterWorkerRequest) returns (UnregisterWorkerResponse) {}
  rpc ListActiveWorkers(ListActiveWorkersRequest) returns (ListActiveWorkersResponse) {}

  // Instance management (engine process registry)
  rpc RegisterInstance(RegisterInstanceRequest) returns (RegisterInstanceResponse) {}
  rpc InstanceHeartbeat(InstanceHeartbeatRequest) returns (InstanceHeartbeatResponse) {}
  rpc UnregisterInstance(UnregisterInstanceRequest) returns (UnregisterInstanceResponse) {}
  rpc ListActiveInstances(ListActiveInstancesRequest) returns (ListActiveInstancesResponse) {}

  // High Availability and State Reconciliation
  rpc ReconcileWorkerState(ReconcileWorkerStateRequest) returns (ReconcileWorkerStateResponse) {}

  // Replica lifecycle
  rpc RegisterReplica(RegisterReplicaRequest) returns (RegisterReplicaResponse) {}
  rpc UpdateReplica(UpdateReplicaRequest) returns (UpdateReplicaResponse) {}
  rpc UnregisterReplica(UnregisterReplicaRequest) returns (UnregisterReplicaResponse) {}
  // Deregister a replica using worker identity rather than replica_id.
  rpc UnregisterReplicaByWorker(UnregisterReplicaByWorkerRequest) returns (UnregisterReplicaByWorkerResponse) {}
  // Mark a single replica unavailable (idempotent).
  rpc MarkReplicaUnavailable(MarkReplicaUnavailableRequest) returns (MarkReplicaUnavailableResponse) {}
  // Wait for in-flight transports to drain for a replica.
  rpc WaitReplicaDrain(WaitReplicaDrainRequest) returns (WaitReplicaDrainResponse) {}
  // V2 with pagination and filtering
  rpc ListReplicasV2(ListReplicasV2Request) returns (ListReplicasV2Response) {}
  // Batch replica counts by artifact id for audit and observability.
  rpc BatchGetReplicaCounts(BatchGetReplicaCountsRequest) returns (BatchGetReplicaCountsResponse) {}

  // Replica transport
  rpc RequestReplicaTransport(RequestReplicaTransportRequest) returns (RequestReplicaTransportResponse) {}
  rpc CompleteReplicaTransport(CompleteReplicaTransportRequest) returns (CompleteReplicaTransportResponse) {}
  rpc QueryTransportWindow(QueryTransportWindowRequest) returns (QueryTransportWindowResponse) {}

  // Chunk directory operations
  rpc QueryChunkLocations(QueryChunkLocationsRequest) returns (QueryChunkLocationsResponse) {}
  rpc BatchUpdateChunkStates(BatchUpdateChunkStatesRequest) returns (BatchUpdateChunkStatesResponse) {}

  // Shard-home leases (byte artifacts): low-cardinality fencing authority.
  rpc AcquireShardHomeLease(AcquireShardHomeLeaseRequest) returns (AcquireShardHomeLeaseResponse) {}
  rpc KeepaliveShardHomeLease(KeepaliveShardHomeLeaseRequest) returns (KeepaliveShardHomeLeaseResponse) {}
  rpc BatchKeepaliveShardHomeLeases(BatchKeepaliveShardHomeLeasesRequest) returns (BatchKeepaliveShardHomeLeasesResponse) {}
  rpc ReleaseShardHomeLease(ReleaseShardHomeLeaseRequest) returns (ReleaseShardHomeLeaseResponse) {}
  rpc GetShardHomeLease(GetShardHomeLeaseRequest) returns (GetShardHomeLeaseResponse) {}
  rpc BatchGetShardHomeLeases(BatchGetShardHomeLeasesRequest) returns (BatchGetShardHomeLeasesResponse) {}
}

// Artifact metadata domain: durable identity and addressing metadata.
service ArtifactCatalogService {
  // Resolve or upsert artifact bindings (e.g., assembly_id -> mi2_id)
  rpc GetArtifactBinding(GetArtifactBindingRequest) returns (GetArtifactBindingResponse) {}
  rpc UpsertArtifactBinding(UpsertArtifactBindingRequest) returns (UpsertArtifactBindingResponse) {}

  // Upsert canonical artifact metadata without registering a replica or disk location.
  rpc UpsertArtifactMetadata(UpsertArtifactMetadataRequest) returns (UpsertArtifactMetadataResponse) {}

  // Get artifact tensor index data by key
  rpc GetArtifactIndex(GetArtifactIndexRequest) returns (GetArtifactIndexResponse) {}
  // Get canonical tensor index by content-addressed artifact_id
  rpc GetArtifactIndexById(GetArtifactIndexByIdRequest) returns (GetArtifactIndexByIdResponse) {}

  // Disk locations
  rpc UpsertArtifactDiskLocation(UpsertArtifactDiskLocationRequest) returns (UpsertArtifactDiskLocationResponse) {}
  rpc ListArtifactDiskLocations(ListArtifactDiskLocationsRequest) returns (ListArtifactDiskLocationsResponse) {}

  // Key mapping
  rpc UpsertKeyMapping(UpsertKeyMappingRequest) returns (UpsertKeyMappingResponse) {}
  rpc SwapKeyMapping(SwapKeyMappingRequest) returns (SwapKeyMappingResponse) {}
  rpc ResolveKeyMapping(ResolveKeyMappingRequest) returns (ResolveKeyMappingResponse) {}
  rpc RevokeKeyMapping(RevokeKeyMappingRequest) returns (RevokeKeyMappingResponse) {}

  // Group version-set realization and staged publish barrier.
  rpc RegisterGroupVersionSet(RegisterGroupVersionSetRequest) returns (RegisterGroupVersionSetResponse) {}
  rpc BeginOrJoinGroupRealization(BeginOrJoinGroupRealizationRequest) returns (BeginOrJoinGroupRealizationResponse) {}
  rpc ReportGroupRealizationPrepared(ReportGroupRealizationPreparedRequest) returns (ReportGroupRealizationPreparedResponse) {}
  rpc PublishGroupRealization(PublishGroupRealizationRequest) returns (PublishGroupRealizationResponse) {}
  rpc WaitGroupRealizationPublished(WaitGroupRealizationPublishedRequest) returns (WaitGroupRealizationPublishedResponse) {}
  rpc AbortGroupRealization(AbortGroupRealizationRequest) returns (AbortGroupRealizationResponse) {}
  rpc GetGroupRealization(GetGroupRealizationRequest) returns (GetGroupRealizationResponse) {}
}

// Assembly/view domain: view coverage/proofs/layouts and assembly-oriented query model.
service AssemblyViewService {
  // Content-addressed query by artifact_id (mi2:...)
  rpc GetArtifactInfoById(GetArtifactInfoByIdRequest) returns (GetArtifactInfoByIdResponse) {}

  // Upsert variant metadata and batched leaf digests
  rpc UpdateArtifactViewState(UpdateArtifactViewStateRequest) returns (UpdateArtifactViewStateResponse) {}
  // Batch write MI2-scoped overlap proof commitments (v2).
  rpc WriteTensorProofCommitments(WriteTensorProofCommitmentsRequest) returns (WriteTensorProofCommitmentsResponse) {}
  // Compare assembly-scoped proof commitments against MI2-scoped commitments.
  rpc CheckProofCommitmentsMatch(CheckProofCommitmentsMatchRequest) returns (CheckProofCommitmentsMatchResponse) {}
  // List variant (view) metadata for an artifact
  rpc ListViews(ListViewsRequest) returns (ListViewsResponse) {}

  // Layout v2
  rpc PutLayoutSpec(PutLayoutSpecRequest) returns (PutLayoutSpecResponse) {}
  rpc GetLayoutSpec(GetLayoutSpecRequest) returns (GetLayoutSpecResponse) {}
  rpc GetAssemblyLayoutBinding(GetAssemblyLayoutBindingRequest) returns (GetAssemblyLayoutBindingResponse) {}
  rpc UpdateAssemblyLayoutBinding(UpdateAssemblyLayoutBindingRequest) returns (UpdateAssemblyLayoutBindingResponse) {}
  rpc GetAssemblyAttempt(GetAssemblyAttemptRequest) returns (GetAssemblyAttemptResponse) {}
  rpc UpsertAssemblyAttempt(UpsertAssemblyAttemptRequest) returns (UpsertAssemblyAttemptResponse) {}
  rpc GetAssemblyReadinessCut(GetAssemblyReadinessCutRequest) returns (GetAssemblyReadinessCutResponse) {}
  rpc UpsertAssemblyReadinessCut(UpsertAssemblyReadinessCutRequest) returns (UpsertAssemblyReadinessCutResponse) {}
  rpc GetAssemblySlotOccupancy(GetAssemblySlotOccupancyRequest) returns (GetAssemblySlotOccupancyResponse) {}
  rpc UpsertAssemblySlotOccupancy(UpsertAssemblySlotOccupancyRequest) returns (UpsertAssemblySlotOccupancyResponse) {}
  rpc ListAssemblySlotOccupancies(ListAssemblySlotOccupanciesRequest) returns (ListAssemblySlotOccupanciesResponse) {}
  rpc UpdateAssemblySlotOccupancyState(UpdateAssemblySlotOccupancyStateRequest) returns (UpdateAssemblySlotOccupancyStateResponse) {}
  rpc AttachLayoutToArtifact(AttachLayoutToArtifactRequest) returns (AttachLayoutToArtifactResponse) {}
  rpc ListArtifactLayouts(ListArtifactLayoutsRequest) returns (ListArtifactLayoutsResponse) {}
}

// Workflow domain: lease-based long-running operations and placement/persistence plans.
service WorkflowOrchestrationService {
  // Unified Operations
  rpc AcquireOperationLease(tensorcast.operation.v1.AcquireOperationLeaseRequest) returns (tensorcast.operation.v1.AcquireOperationLeaseResponse) {}
  rpc KeepaliveOperationLease(tensorcast.operation.v1.KeepaliveOperationLeaseRequest) returns (tensorcast.operation.v1.KeepaliveOperationLeaseResponse) {}
  rpc ReleaseOperationLease(tensorcast.operation.v1.ReleaseOperationLeaseRequest) returns (tensorcast.operation.v1.ReleaseOperationLeaseResponse) {}
  rpc GetOperation(tensorcast.operation.v1.GetOperationRequest) returns (tensorcast.operation.v1.GetOperationResponse) {}
  rpc UpdateOperation(tensorcast.operation.v1.UpdateOperationRequest) returns (tensorcast.operation.v1.UpdateOperationResponse) {}

  // Placement & persistence
  rpc PlanPlacement(PlanPlacementRequest) returns (PlanPlacementResponse) {}
  rpc ReportPersistenceStatus(ReportPersistenceStatusRequest) returns (ReportPersistenceStatusResponse) {}
}

service ClusterAdminService {
  // Health check endpoint
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {}
  // Server info endpoint (advertise + bind metadata)
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse) {}
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_NOT_FOUND = 1;
  STATUS_TIMED_OUT = 2;
  STATUS_TOO_MANY_REQUESTS = 3;
  STATUS_STATE_SYNC_REQUIRED = 4;
  STATUS_ERROR = 5;
  STATUS_OK = 6;
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_RECONNECTING = 1;
  CONNECTION_STATUS_DISCONNECTED = 2;
  CONNECTION_STATUS_CONNECTED = 3;
}

enum ReconcileRequestKind {
  RECONCILE_REQUEST_KIND_UNSPECIFIED = 0;
  RECONCILE_REQUEST_KIND_SNAPSHOT = 1;
  RECONCILE_REQUEST_KIND_DELTA = 2;
}

enum ReconcileResultKind {
  RECONCILE_RESULT_KIND_UNSPECIFIED = 0;
  RECONCILE_RESULT_KIND_APPLIED = 1;
  RECONCILE_RESULT_KIND_NOOP = 2;
  RECONCILE_RESULT_KIND_IGNORED_STALE = 3;
  RECONCILE_RESULT_KIND_RETRY_LATER = 4;
  RECONCILE_RESULT_KIND_REBASE_REQUIRED = 5;
  RECONCILE_RESULT_KIND_FATAL = 6;
}

// Worker/daemon capability flags (bit positions in capability_flags).
enum WorkerCapabilityFlag {
  WORKER_CAPABILITY_FLAG_UNSPECIFIED = 0;
  WORKER_CAPABILITY_FLAG_QUEUE_BROKER_ENABLED = 1;
  WORKER_CAPABILITY_FLAG_RETENTION_HANDLES_ENABLED = 2;
  WORKER_CAPABILITY_FLAG_CAPABILITY_TOKENS_V2_ENABLED = 3;
  WORKER_CAPABILITY_FLAG_GATEWAY_INGRESS_ENABLED = 4;
  WORKER_CAPABILITY_FLAG_SHARD_HOME_ELIGIBLE = 5;
}

// Instance capability flags (bit positions in capability_flags).
enum InstanceCapabilityFlag {
  INSTANCE_CAPABILITY_FLAG_UNSPECIFIED = 0;
  INSTANCE_CAPABILITY_FLAG_EXECUTION_SIGNALS_ENABLED = 1;
  INSTANCE_CAPABILITY_FLAG_NODE_AGENT_ENABLED = 2;
}

// Shard-home lease (byte artifact) used for routed home authority fencing.
message ShardHomeLease {
  uint64 shard_id = 1;
  string holder_daemon_id = 2;
  string lease_token = 3;
  uint64 lease_generation = 4;
  google.protobuf.Timestamp expires_at = 5;
}

// Shard-home route used for routing decisions (no lease_token).
message ShardHomeRoute {
  uint64 shard_id = 1;
  string holder_daemon_id = 2;
  uint64 lease_generation = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message AcquireShardHomeLeaseRequest {
  uint64 shard_id = 1;
  // Stable daemon identity for the acquiring daemon.
  string holder_daemon_id = 2;
  // Requested lease TTL.
  uint64 ttl_ms = 3;
}

message AcquireShardHomeLeaseResponse {
  bool acquired = 1;
  ShardHomeLease lease = 2;
}

message KeepaliveShardHomeLeaseRequest {
  string lease_token = 1;
  uint64 ttl_ms = 2;
}

message KeepaliveShardHomeLeaseResponse {
  ShardHomeLease lease = 1;
}

message ShardHomeLeaseKeepalive {
  uint64 shard_id = 1;
  uint64 lease_generation = 2;
  string lease_token = 3;
}

message ShardHomeLeaseKeepaliveOutcome {
  uint64 shard_id = 1;
  uint64 lease_generation = 2;
  string lease_token = 3;
  bool ok = 4;
  ShardHomeLease lease = 5;
  string message = 6;
}

message BatchKeepaliveShardHomeLeasesRequest {
  repeated ShardHomeLeaseKeepalive leases = 1;
  uint64 ttl_ms = 2;
}

message BatchKeepaliveShardHomeLeasesResponse {
  repeated ShardHomeLeaseKeepaliveOutcome outcomes = 1;
}

message ReleaseShardHomeLeaseRequest {
  string lease_token = 1;
}

message ReleaseShardHomeLeaseResponse {
  bool released = 1;
}

message GetShardHomeLeaseRequest {
  uint64 shard_id = 1;
}

message GetShardHomeLeaseResponse {
  ShardHomeRoute lease = 1;
}

message BatchGetShardHomeLeasesRequest {
  repeated uint64 shard_ids = 1;
}

message BatchGetShardHomeLeasesResponse {
  repeated ShardHomeRoute leases = 1;
}

// ========== Worker管理相关消息 ==========

// Worker注册请求
message RegisterWorkerRequest {
  string node_id = 1; // 节点主机名
  string node_address = 2; // IP地址
  uint32 grpc_port = 3; // gRPC 服务端口
  uint32 p2p_port = 4; // COMM 端口
  uint64 mem_pool_total_size = 5; // 内存池总大小（字节）
  uint64 mem_pool_available_size = 6; // 内存池可用大小（字节）

  // HA fields
  bool is_recovery_registration = 7; // 是否为恢复注册
  string previous_worker_id = 8; // 上一个 Worker ID (用于恢复)
  string daemon_id = 9; // Required stable daemon identity (from daemon config)
  uint64 capability_flags = 10; // Bitset of WorkerCapabilityFlag values
}

message RegisterWorkerResponse {
  Status status = 1;
  string worker_id = 2; // 系统分配的 Worker ID
  uint32 heartbeat_interval_ms = 3; // 建议的心跳间隔（毫秒）

  // HA fields
  bool state_sync_required = 4; // 是否需要状态同步
  uint64 expected_state_version = 5; // 期望的状态版本
  uint64 reconcile_generation = 6; // Worker reconcile generation for this daemon incarnation
}

// Enhanced Worker心跳
message WorkerHeartbeatRequest {
  string worker_id = 1;
  uint64 mem_pool_available_size = 2; // 当前内存池可用大小（字节）
  bool accepting_new_requests = 3; // 是否接受新请求（用于优雅退出）

  // Enhanced fields for HA
  uint64 state_version = 4; // 增量状态版本
  string state_checksum = 5; // 当前状态校验和
  repeated string registered_artifact_ids = 6; // 本地注册的 Artifact 列表（内容寻址ID）
  int64 last_successful_sync = 7; // 最后成功同步时间戳
  ConnectionStatus global_store_status = 8; // 从worker角度看的连接状态
  optional string daemon_id = 9; // Optional for sanity-check logging
  optional uint64 capability_flags = 10; // Bitset of WorkerCapabilityFlag values
}

message WorkerHeartbeatResponse {
  Status status = 1; // OK 或 NOT_FOUND

  // Enhanced fields for HA
  bool state_sync_required = 2; // 触发状态同步
  uint64 expected_state_version = 3; // 期望状态版本
  repeated string obsolete_replicas = 4; // 应该取消注册的副本
  google.protobuf.Timestamp server_timestamp_ts = 5; // 服务器时间戳（标准类型）
}

// Worker注销
message UnregisterWorkerRequest {
  string worker_id = 1;
  bool is_graceful_shutdown = 2; // 是否为优雅关闭
  optional string client_request_id = 3;
}

message UnregisterWorkerResponse {
  Status status = 1;
}

// 查询活跃Worker
message ListActiveWorkersRequest {
  bool include_unavailable = 1; // 是否包含不接受新请求的 Worker
  uint64 required_capability_flags = 2; // Bitset of WorkerCapabilityFlag values
}

message ListActiveWorkersResponse {
  message WorkerInfo {
    string worker_id = 1;
    string node_id = 2;
    string node_address = 3;
    uint32 grpc_port = 4;
    uint32 p2p_port = 5;
    uint64 mem_pool_total_size = 6;
    uint64 mem_pool_available_size = 7;
    bool accepting_new_requests = 8;
    google.protobuf.Timestamp last_heartbeat_ts = 9; // 标准时间戳

    // HA fields
    uint64 state_version = 10; // 当前状态版本
    ConnectionStatus status = 11; // 连接状态
    string daemon_id = 12; // Stable daemon identity
    uint64 capability_flags = 13; // Bitset of WorkerCapabilityFlag values
  }
  repeated WorkerInfo workers = 1;
}

// ========== Instance registry ==========

message RegisterInstanceRequest {
  string instance_id = 1;
  string daemon_id = 2;
  string engine = 3;
  optional string worker_id = 4;
  string signals_endpoint = 5;
  map<string, string> labels = 6;
  uint64 capability_flags = 7; // Bitset of InstanceCapabilityFlag values
  string execution_endpoint = 8;
  string execution_host_kind = 9;
}

message RegisterInstanceResponse {
  Status status = 1;
  string instance_id = 2;
  uint32 heartbeat_interval_ms = 3;
}

message InstanceHeartbeatRequest {
  string instance_id = 1;
  optional string worker_id = 2;
  optional uint64 capability_flags = 3; // Bitset of InstanceCapabilityFlag values
}

message InstanceHeartbeatResponse {
  Status status = 1;
}

message UnregisterInstanceRequest {
  string instance_id = 1;
  bool is_graceful_shutdown = 2;
}

message UnregisterInstanceResponse {
  Status status = 1;
}

message ListActiveInstancesRequest {
  bool include_unavailable = 1;
  uint64 required_capability_flags = 2; // Bitset of InstanceCapabilityFlag values
}

message ListActiveInstancesResponse {
  message InstanceInfo {
    string instance_id = 1;
    string daemon_id = 2;
    string worker_id = 3;
    string engine = 4;
    string signals_endpoint = 5;
    google.protobuf.Timestamp last_heartbeat_ts = 6;
    map<string, string> labels = 7;
    ConnectionStatus status = 8;
    uint64 capability_flags = 9; // Bitset of InstanceCapabilityFlag values
    string execution_endpoint = 10;
    string execution_host_kind = 11;
  }
  repeated InstanceInfo instances = 1;
}

// ========== Worker state reconciliation ==========

message ReconcileWorkerStateRequest {
  string worker_id = 1;
  string daemon_id = 2;
  uint64 generation = 3;
  uint64 request_seq = 4;
  repeated tensorcast.common.v1.ReplicaInfo inventory = 5;
  ReconcileRequestKind request_kind = 6;
}

message ReconcileWorkerStateResponse {
  ReconcileResultKind result_kind = 1;
  uint32 retry_after_ms = 2;
  uint64 new_state_version = 3;
  string new_state_checksum = 4;
  repeated StateChange state_changes = 5;
  repeated tensorcast.common.v1.ReplicaInfo expected_replicas = 6;
}

message StateChange {
  enum ChangeType {
    CHANGE_TYPE_UNSPECIFIED = 0;
    CHANGE_TYPE_REMOVE_REPLICA = 1;
    CHANGE_TYPE_UPDATE_REPLICA = 2;
    CHANGE_TYPE_ADD_REPLICA = 3;
  }

  ChangeType type = 1;
  tensorcast.common.v1.ReplicaInfo replica_info = 2;
  string reason = 3;
}

// Removed legacy disk-path based artifact info messages

// Content-addressed artifact info
message GetArtifactInfoByIdRequest {
  string artifact_id = 1; // "mi2:..."
  google.protobuf.BoolValue include_replicas = 2;
  bool include_leaves = 3;
  tensorcast.common.v1.ByteSpaceRef requested_byte_space = 4;
  repeated uint64 leaf_idxs = 6;
  bool include_view_meta = 7;
}

message GetArtifactInfoByIdResponse {
  Status status = 1;
  repeated tensorcast.common.v1.MemoryInfo replicas = 2; // All replicas under the content ID
  repeated Leaf leaves = 3;
  ViewMeta view_meta = 4;
  // Missing *byte* coverage in the requested HashSpaceRef byte stream (units: bytes).
  // Missing Merkle leaf digests MUST be reported via `partial_leaf_coverage` (units: leaf indices), not here.
  repeated PartialCoverageDetail partial_coverage = 5;
  tensorcast.common.v1.ArtifactDescriptor descriptor = 6;
  // Missing Merkle leaf digests when `include_leaves=true` (units: leaf indices).
  repeated PartialLeafCoverageDetail partial_leaf_coverage = 7;
}

message Leaf {
  uint64 leaf_idx = 1;
  bytes digest = 2;
}

message ViewMeta {
  string view_spec_json = 1;
  uint64 view_size = 2;
  string view_data_hash = 3;
  google.protobuf.Timestamp verified_at = 4;
}

message UpdateArtifactViewStateRequest {
  string artifact_id = 1;
  optional ViewUpsert view = 2;
  repeated LeafWrite leaf_writes = 3;
  repeated PieceProofDigestWrite proof_digests = 4;
}

message UpdateArtifactViewStateResponse {
  Status status = 1;
}

message ListViewsRequest {
  string artifact_id = 1;
  tensorcast.common.v1.Pagination pagination = 2;
}

message ViewInfo {
  string view_id = 1;
  string view_spec_json = 2;
  uint64 view_size = 3;
  string view_data_hash = 4;
  google.protobuf.Timestamp verified_at = 5;
  CanonicalCoverage canonical_coverage = 6;
  repeated Range canonical_ranges = 7;
}

message ListViewsResponse {
  Status status = 1;
  repeated ViewInfo views = 2;
  tensorcast.common.v1.PageInfo page_info = 3;
}

message CanonicalCoverage {
  uint64 total_bytes = 1;
  uint64 covered_bytes = 2;
}

message ViewUpsert {
  string view_id = 1;
  string view_spec_json = 2;
  uint64 view_size = 3;
  string view_data_hash = 4;
  google.protobuf.Timestamp verified_at = 5;
  CanonicalCoverage canonical_coverage = 6;
  repeated Range canonical_ranges = 7;
}

message PieceProofDigestWrite {
  // Piece view identity (content-addressed view id).
  string view_id = 1;
  // Tensor name from the canonical index.
  string tensor_name = 2;
  // Proof schema version (e.g. "v1").
  string proof_schema_version = 3;
  // Tensor-local proof chunk index.
  uint64 proof_chunk_idx = 4;
  // Raw 32-byte SHA-256 digest.
  bytes digest = 5;
}

message TensorProofCommitmentWrite {
  // Tensor name from the canonical index.
  string tensor_name = 1;
  // Tensor-local proof chunk index.
  uint64 proof_chunk_idx = 2;
  // Raw 32-byte SHA-256 digest.
  bytes digest = 3;
}

message WriteTensorProofCommitmentsRequest {
  string mi2_id = 1;
  // Proof schema version (e.g. "v1").
  string proof_schema_version = 2;
  repeated TensorProofCommitmentWrite commitments = 3;
}

message WriteTensorProofCommitmentsResponse {
  Status status = 1;
  uint32 inserted = 2;
}

message CheckProofCommitmentsMatchRequest {
  string assembly_id = 1;
  string mi2_id = 2;
  // Proof schema version (e.g. "v1").
  string proof_schema_version = 3;
  // Tensor names to compare (must be non-empty).
  repeated string tensor_names = 4;
}

message CheckProofCommitmentsMatchResponse {
  Status status = 1;
  bool match = 2;
}

// ========== Layout v2 ==========

message GetLayoutSpecRequest {
  string layout_id = 1;
}

message GetLayoutSpecResponse {
  Status status = 1;
  tensorcast.layout.v1.LayoutSpecRecord record = 2;
}

message PutLayoutSpecRequest {
  tensorcast.layout.v1.LayoutSpec layout = 1;
  // Optional audit JSON form (not hashed).
  string layout_json = 2;
  // Optional canonical index bytes used to seed layout validation when Global
  // Store has not yet persisted the index for this multihash.
  bytes canonical_index_data = 3;
}

message PutLayoutSpecResponse {
  Status status = 1;
  string layout_id = 2;
}

message AssemblyLayoutBinding {
  string assembly_id = 1;
  string layout_id = 2;
  uint64 binding_version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message GetAssemblyLayoutBindingRequest {
  string assembly_id = 1;
}

message GetAssemblyLayoutBindingResponse {
  Status status = 1;
  AssemblyLayoutBinding binding = 2;
}

message UpdateAssemblyLayoutBindingRequest {
  string assembly_id = 1;
  string layout_id = 2;
  // CAS for safe concurrent updates.
  // - Create: expected_binding_version = 0
  // - Update: expected_binding_version = current binding_version
  uint64 expected_binding_version = 3;
}

message UpdateAssemblyLayoutBindingResponse {
  Status status = 1;
  AssemblyLayoutBinding binding = 2;
}

message AssemblyAttempt {
  string attempt_id = 1;
  string workspace_assembly_id = 2;
  string layout_id = 3;
  string attempt_intent_digest = 4;
  string coordinator_operation_id = 5;
  bytes attempt_record_proto = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message GetAssemblyAttemptRequest {
  oneof key {
    string attempt_id = 1;
    string workspace_assembly_id = 2;
  }
}

message GetAssemblyAttemptResponse {
  Status status = 1;
  AssemblyAttempt attempt = 2;
}

message UpsertAssemblyAttemptRequest {
  AssemblyAttempt attempt = 1;
}

message UpsertAssemblyAttemptResponse {
  Status status = 1;
  AssemblyAttempt attempt = 2;
}

message AssemblyReadinessCut {
  string attempt_id = 1;
  bytes readiness_cut_proto = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message GetAssemblyReadinessCutRequest {
  string attempt_id = 1;
}

message GetAssemblyReadinessCutResponse {
  Status status = 1;
  AssemblyReadinessCut readiness_cut = 2;
}

message UpsertAssemblyReadinessCutRequest {
  AssemblyReadinessCut readiness_cut = 1;
}

message UpsertAssemblyReadinessCutResponse {
  Status status = 1;
