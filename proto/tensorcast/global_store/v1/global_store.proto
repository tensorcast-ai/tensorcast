syntax = "proto3";

package tensorcast.global_store.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "tensorcast/common/v1/common.proto";

service GlobalStoreService {
  rpc RegisterReplica(RegisterReplicaRequest) returns (RegisterReplicaResponse) {}

  rpc UpdateReplica(UpdateReplicaRequest) returns (UpdateReplicaResponse) {}

  rpc UnregisterReplica(UnregisterReplicaRequest) returns (UnregisterReplicaResponse) {}

  rpc RequestReplicaTransport(RequestReplicaTransportRequest) returns (RequestReplicaTransportResponse) {}

  rpc CompleteReplicaTransport(CompleteReplicaTransportRequest) returns (CompleteReplicaTransportResponse) {}

  // V2 with pagination and filtering
  rpc ListReplicasV2(ListReplicasV2Request) returns (ListReplicasV2Response) {}

  // Content-addressed query by artifact_id (mi2:...)
  rpc GetArtifactInfoById(GetArtifactInfoByIdRequest) returns (GetArtifactInfoByIdResponse) {}

  // Get artifact tensor index data by key
  rpc GetArtifactIndex(GetArtifactIndexRequest) returns (GetArtifactIndexResponse) {}

  // Get canonical tensor index by content-addressed artifact_id
  rpc GetArtifactIndexById(GetArtifactIndexByIdRequest) returns (GetArtifactIndexByIdResponse) {}

  // Worker management
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse) {}
  rpc WorkerHeartbeat(WorkerHeartbeatRequest) returns (WorkerHeartbeatResponse) {}
  rpc UnregisterWorker(UnregisterWorkerRequest) returns (UnregisterWorkerResponse) {}
  rpc ListActiveWorkers(ListActiveWorkersRequest) returns (ListActiveWorkersResponse) {}

  // High Availability and State Synchronization
  rpc SynchronizeWorkerState(SynchronizeWorkerStateRequest) returns (SynchronizeWorkerStateResponse) {}
  rpc RequestFullStateSync(RequestFullStateSyncRequest) returns (RequestFullStateSyncResponse) {}

  // Health check endpoint
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {}

  // ========== Chunk Directory Operations ==========
  // Query chunk locations for distributed memory pool
  rpc QueryChunkLocations(QueryChunkLocationsRequest) returns (QueryChunkLocationsResponse) {}

  // Update chunk states (called by StoreDaemon periodically)
  rpc BatchUpdateChunkStates(BatchUpdateChunkStatesRequest) returns (BatchUpdateChunkStatesResponse) {}

  // ========== Key Mapping (RFC-0014) ==========
  // Map a human-readable key to a single artifact_id, with optional replica hints
  rpc UpsertKeyMapping(UpsertKeyMappingRequest) returns (UpsertKeyMappingResponse) {}
  // Resolve a key to its artifact_id and optional hints
  rpc ResolveKeyMapping(ResolveKeyMappingRequest) returns (ResolveKeyMappingResponse) {}
  // Revoke an existing key mapping
  rpc RevokeKeyMapping(RevokeKeyMappingRequest) returns (RevokeKeyMappingResponse) {}
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_NOT_FOUND = 1;
  STATUS_TIMED_OUT = 2;
  STATUS_TOO_MANY_REQUESTS = 3;
  STATUS_STATE_SYNC_REQUIRED = 4;
  STATUS_ERROR = 5;
  STATUS_OK = 6;
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_RECONNECTING = 1;
  CONNECTION_STATUS_DISCONNECTED = 2;
  CONNECTION_STATUS_CONNECTED = 3;
}

// ========== Worker管理相关消息 ==========

// Worker注册请求
message RegisterWorkerRequest {
  string node_id = 1; // 节点主机名
  string node_address = 2; // IP地址
  uint32 grpc_port = 3; // gRPC 服务端口
  uint32 p2p_port = 4; // COMM 端口
  uint64 mem_pool_total_size = 5; // 内存池总大小（字节）
  uint64 mem_pool_available_size = 6; // 内存池可用大小（字节）

  // HA fields
  bool is_recovery_registration = 7; // 是否为恢复注册
  string previous_worker_id = 8; // 上一个 Worker ID (用于恢复)
}

message RegisterWorkerResponse {
  Status status = 1;
  string worker_id = 2; // 系统分配的 Worker ID
  uint32 heartbeat_interval_ms = 3; // 建议的心跳间隔（毫秒）

  // HA fields
  bool state_sync_required = 4; // 是否需要状态同步
  uint64 expected_state_version = 5; // 期望的状态版本
}

// Enhanced Worker心跳
message WorkerHeartbeatRequest {
  string worker_id = 1;
  uint64 mem_pool_available_size = 2; // 当前内存池可用大小（字节）
  bool accepting_new_requests = 3; // 是否接受新请求（用于优雅退出）

  // Enhanced fields for HA
  uint64 state_version = 4; // 增量状态版本
  string state_checksum = 5; // 当前状态校验和
  repeated string registered_artifact_ids = 6; // 本地注册的 Artifact 列表（内容寻址ID）
  int64 last_successful_sync = 7; // 最后成功同步时间戳
  ConnectionStatus global_store_status = 8; // 从worker角度看的连接状态
}

message WorkerHeartbeatResponse {
  Status status = 1; // OK 或 NOT_FOUND

  // Enhanced fields for HA
  bool state_sync_required = 2; // 触发状态同步
  uint64 expected_state_version = 3; // 期望状态版本
  repeated string obsolete_replicas = 4; // 应该取消注册的副本
  google.protobuf.Timestamp server_timestamp_ts = 5; // 服务器时间戳（标准类型）
}

// Worker注销
message UnregisterWorkerRequest {
  string worker_id = 1;
  bool is_graceful_shutdown = 2; // 是否为优雅关闭
}

message UnregisterWorkerResponse {
  Status status = 1;
}

// 查询活跃Worker
message ListActiveWorkersRequest {
  bool include_unavailable = 1; // 是否包含不接受新请求的 Worker
}

message ListActiveWorkersResponse {
  message WorkerInfo {
    string worker_id = 1;
    string node_id = 2;
    string node_address = 3;
    uint32 grpc_port = 4;
    uint32 p2p_port = 5;
    uint64 mem_pool_total_size = 6;
    uint64 mem_pool_available_size = 7;
    bool accepting_new_requests = 8;
    google.protobuf.Timestamp last_heartbeat_ts = 9; // 标准时间戳

    // HA fields
    uint64 state_version = 10; // 当前状态版本
    ConnectionStatus status = 11; // 连接状态
  }
  repeated WorkerInfo workers = 1;
}

// ========== State Synchronization Messages ==========

message WorkerLocalState {
  string worker_id = 1;
  uint64 state_version = 2;
  string state_checksum = 3;
  repeated tensorcast.common.v1.ReplicaInfo local_replicas = 4;
  google.protobuf.Timestamp last_update_ts = 5;
}

// ReplicaInfo moved to common

// RFC-0007 descriptor for content-addressed identity
// Moved to tensorcast.artifact.v1.ArtifactDescriptor

message SynchronizeWorkerStateRequest {
  string worker_id = 1;
  WorkerLocalState local_state = 2;
  bool force_full_sync = 3; // 强制完整同步
}

message SynchronizeWorkerStateResponse {
  Status status = 1;
  uint64 new_state_version = 2;
  repeated StateChange state_changes = 3;
  string new_state_checksum = 4;
}

message StateChange {
  enum ChangeType {
    CHANGE_TYPE_UNSPECIFIED = 0;
    CHANGE_TYPE_REMOVE_REPLICA = 1;
    CHANGE_TYPE_UPDATE_REPLICA = 2;
    CHANGE_TYPE_ADD_REPLICA = 3;
  }

  ChangeType type = 1;
  tensorcast.common.v1.ReplicaInfo replica_info = 2;
  string reason = 3;
}

message RequestFullStateSyncRequest {
  string worker_id = 1;
  uint64 current_state_version = 2;
}

message RequestFullStateSyncResponse {
  Status status = 1;
  uint64 new_state_version = 2;
  repeated tensorcast.common.v1.ReplicaInfo expected_replicas = 3;
  string new_state_checksum = 4;
}

// Removed legacy disk-path based artifact info messages

// Content-addressed artifact info
message GetArtifactInfoByIdRequest {
  string artifact_id = 1; // "mi2:..."
}

message GetArtifactInfoByIdResponse {
  Status status = 1;
  repeated tensorcast.common.v1.MemoryInfo replicas = 2; // All replicas under the content ID
}

// Get artifact index request
message GetArtifactIndexRequest {
  string tensor_index_key = 1; // SHA-256 hash of canonical index
}

// Get artifact index response
message GetArtifactIndexResponse {
  Status status = 1;
  bytes tensor_index_data = 2; // Canonical JSON bytes
  string encoding = 3; // Encoding format (e.g., "json")
  string schema_version = 4; // Schema version (e.g., "v2")
}

// Get canonical index by artifact_id
message GetArtifactIndexByIdRequest {
  string artifact_id = 1;
}
message GetArtifactIndexByIdResponse {
  Status status = 1;
  bytes tensor_index_data = 2;
  string encoding = 3;
  string schema_version = 4;
}

// Legacy ListReplicas removed in favor of V2

message RegisterReplicaRequest {
  string artifact_id = 1; // content-addressed ID (mi2:...), optional for disk/mixed flows
  tensorcast.common.v1.MemoryInfo mem_info = 2;
  uint32 max_concurrency = 3;
  string worker_id = 4;

  // Optional tensor index data for UPSERT (if key not yet in artifact_indices)
  optional bytes tensor_index_data = 5; // Canonical JSON bytes (for UPSERT)
  optional string encoding = 6; // Encoding format (e.g., "json")
  optional string schema_version = 7; // Schema version (e.g., "v2")
  // Legacy disk path for non-content-addressed cases
  optional string disk_path = 8;

  // RFC-0007: Optionally include content-addressed descriptor for persistence
  optional tensorcast.common.v1.ArtifactDescriptor descriptor = 9;
}

message RegisterReplicaResponse {
  Status status = 1;
  string artifact_id = 2;
  string replica_id = 3;
}

message UpdateReplicaRequest {
  string artifact_id = 1;
  string replica_id = 2;
}

message UpdateReplicaResponse {
  Status status = 1;
  string artifact_id = 2;
  string replica_id = 3;
}

message UnregisterReplicaRequest {
  string artifact_id = 1;
  string replica_id = 2;
}

message UnregisterReplicaResponse {
  Status status = 1;
}

// MemoryInfo moved to common

// MemoryInfoList removed with legacy ListReplicas

message RequestReplicaTransportRequest {
  string artifact_id = 1; // content-addressed id
  tensorcast.common.v1.MemoryInfo local_memory_info = 2;
  google.protobuf.Duration wait_timeout_dur = 3; // 标准超时时长
  string source_node_id = 4;
  string source_address = 5;
  uint32 source_port = 6;
}

message RequestReplicaTransportResponse {
  Status status = 1;
  tensorcast.common.v1.MemoryInfo remote_memory_info = 2;
  string transport_id = 3;
}

message CompleteReplicaTransportRequest {
  string transport_id = 1;
}

message CompleteReplicaTransportResponse {
  Status status = 1;
}

// ========== Health Check ==========

// Simple ping request to verify connectivity.
message HealthCheckRequest {}

// Health check response returns OK if the server is reachable.
message HealthCheckResponse {
  Status status = 1;
}

// ========== Chunk Directory Messages ==========

// Chunk state enum (matches DVMP ChunkState)
enum ChunkState {
  CHUNK_STATE_UNSPECIFIED = 0; // Unspecified state
  CHUNK_STATE_LOCKED_TX = 1; // Being transferred
  CHUNK_STATE_COPIED_GPU = 2; // Fully copied to GPU
  CHUNK_STATE_COLD = 3; // Resident but evictable
  CHUNK_STATE_EVICTED = 4; // Evicted from memory
  CHUNK_STATE_HOT = 5; // Resident, not yet transferred
}

// Query chunk locations request
message QueryChunkLocationsRequest {
  string artifact_id = 1;
  repeated uint32 chunk_indices = 2; // Specific chunks to query
}

// Information about a chunk location
message ChunkLocation {
  uint32 chunk_idx = 1;
  string node_id = 2;
  string node_address = 3;
  uint32 p2p_port = 4;
  ChunkState state = 5;
  float node_load_ratio = 6;
  string device_uuid = 7;
  uint32 replica = 8;
}

// Query chunk locations response
message QueryChunkLocationsResponse {
  Status status = 1;
  repeated ChunkLocation locations = 2;
}

// Chunk state update
message ChunkStateUpdate {
  string artifact_id = 1;
  uint32 chunk_idx = 2;
  ChunkState state = 3;
  string device_uuid = 4;
  uint32 replica = 5;
}

// Batch update chunk states request
message BatchUpdateChunkStatesRequest {
  string worker_id = 1;
  string node_id = 2;
  repeated ChunkStateUpdate updates = 3;
}

// Batch update chunk states response
message BatchUpdateChunkStatesResponse {
  Status status = 1;
  uint32 updates_applied = 2;
}

// ========== Pagination (local, temporary until common proto is introduced) ==========
// Flattened record for V2 listing
message ArtifactReplicaRecord {
  string artifact_id = 1;
  tensorcast.common.v1.MemoryInfo memory_info = 2;
}

message ListReplicasV2Request {
  // Optional filters
  optional string node_id = 1;
  optional string node_address = 2;
  optional tensorcast.common.v1.MemoryType memory_type = 3;
  optional uint32 device_id = 4;
  optional string artifact_id = 5;

  // Pagination
  tensorcast.common.v1.Pagination pagination = 100;
}

message ListReplicasV2Response {
  repeated ArtifactReplicaRecord replicas = 1;
  tensorcast.common.v1.PageInfo page_info = 2;
}

// ========== RFC-0014 Key Mapping Messages ==========
// Upsert/resolve a mapping from a human-friendly key to a content-addressed artifact_id.
// The mapping is unique: one key must point to exactly one artifact_id.
// Optional fields provide hints (e.g., a known disk_path) for client fallbacks.

message UpsertKeyMappingRequest {
  string key = 1;
  string artifact_id = 2;
  // Optional hints (opaque to server logic except for persistence)
  string replica_uuid = 3;
  string daemon_address = 4;
  string disk_path = 5;
  google.protobuf.Duration ttl = 6; // Optional TTL for the mapping
}
message UpsertKeyMappingResponse {
  Status status = 1;
  string conflict_reason = 2;
}

message ResolveKeyMappingRequest {
  string key = 1;
}
message ResolveKeyMappingResponse {
  Status status = 1;
  string artifact_id = 2;
  string replica_uuid = 3;
  string daemon_address = 4;
  string disk_path = 5;
}

message RevokeKeyMappingRequest {
  string key = 1;
}
message RevokeKeyMappingResponse {
  Status status = 1;
}
