syntax = "proto3";

package tensorcast.common.v1;

import "google/protobuf/timestamp.proto";

message Pagination {
  optional uint32 page_size = 1;
  optional string page_token = 2;
}

message PageInfo {
  optional string next_page_token = 1;
  optional uint32 total_size = 2;
}

message ArtifactDescriptor {
  string artifact_id = 1;
  string index_multihash = 2;
  string data_multihash = 3;
  string schema_version = 4;
  string encoding = 5;
  uint64 total_size = 6;
  ArtifactIdKind id_kind = 7;
}

enum ArtifactIdKind {
  ARTIFACT_ID_KIND_UNSPECIFIED = 0;
  ARTIFACT_ID_KIND_MI2 = 1;
  ARTIFACT_ID_KIND_CGID = 2;
}

enum MemoryType {
  MEMORY_TYPE_UNSPECIFIED = 0;
  MEMORY_TYPE_RAM = 1;
  MEMORY_TYPE_GPU = 2;
  MEMORY_TYPE_DISK = 3;
}

enum ByteSpaceKind {
  BYTE_SPACE_KIND_UNSPECIFIED = 0;
  BYTE_SPACE_KIND_CANONICAL = 1;
  BYTE_SPACE_KIND_VIEW = 2;
}

message ByteSpaceRef {
  ByteSpaceKind kind = 1;
  string id = 2;
}

// HashSpaceRef identifies a verifiable byte stream for hashing and leaf digests.
//
// This is distinct from ByteSpaceRef:
// - ByteSpaceRef is used for routing/residency/locks/transport (physical concerns).
// - HashSpaceRef is used for verification and proofs (hashing concerns).
//
// Canonical hashing is anchored by the canonical index, so `canonical_index_multihash`
// is required when `byte_space.kind == BYTE_SPACE_KIND_CANONICAL`.
message HashSpaceRef {
  ByteSpaceRef byte_space = 1;
  string canonical_index_multihash = 2;
}

message MemoryInfo {
  string node_id = 1;
  string node_address = 2;
  uint32 node_port = 3;
  uint64 memory_size = 5;
  MemoryType memory_type = 6;
  uint32 device_id = 7;
  repeated string remote_memory_keys = 8;
  repeated uint64 buffer_sizes = 9;
  bool is_memory_replica = 10;
  string tensor_index_key = 11;
  google.protobuf.Timestamp creation_ts = 12;
  string source_process_id = 13;
  // Optional verification metadata (JSON). When present, receivers may perform
  // integrity verification (e.g., KEY_POINTS or SEGMENT_HASHES) after transfer.
  string verification_json = 14;
  google.protobuf.Timestamp expires_at = 15;
  ByteSpaceRef byte_space = 16;
}

message ReplicaRef {
  string artifact_id = 1;
  string replica_id = 2;
}

message ReplicaStats {
  uint32 max_concurrency = 1;
  uint32 current_requests = 2;
  bool is_available = 3;
  google.protobuf.Timestamp registered_ts = 4;
}

message ReplicaInfo {
  ReplicaRef ref = 1;
  MemoryInfo memory_info = 2;
  ReplicaStats stats = 3;
}

message NarrowOp {
  uint32 dim = 1;
  int64 start = 2;
  uint64 length = 3;
}

message TransposeOp {
  uint32 dim0 = 1;
  uint32 dim1 = 2;
}

message Op {
  oneof kind {
    NarrowOp narrow = 1;
    TransposeOp transpose = 2;
  }
}

message TensorViewOps {
  repeated Op ops = 1;
}

message ViewSpec {
  map<string, TensorViewOps> tensors = 1;
}

message ArtifactSelection {
  string artifact_id = 1;
  string view_id = 2;
  bytes logical_layout_hash = 3;
  bytes selection_hash = 4;
  bytes view_subset_hash = 5;
  ViewSpec view_spec = 6;
  repeated string tensor_names = 7;
}
