name: "Setup Build Environment"
description: "Sets up Bazel, uv, Python, and installs dependencies."

runs:
  using: "composite"
  steps:
    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.15.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true
        bazelisk-version: 1.16.0

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.6.11"
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install

    - name: Install Python dependencies
      shell: bash
      run: uv sync --locked --all-extras --dev

    - name: Create credentials.json
      shell: bash
      run: echo "${{ secrets.GCLOUD_SERVICE_ACCOUNT }}" > credentials.json