name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tests:
    name: C++ Tests
    runs-on: ubuntu-latest-m
    container: nvidia/cuda:12.4.0-devel-ubuntu22.04
    defaults:
      run:
        shell: bash
    env:
      USE_FAKE_CUDA: "1"
      CUDA_HOME: "/usr/local/cuda"
      UV_CACHE_DIR: /tmp/.uv-cache
      BAZEL_REMOTE_CACHE: https://storage.googleapis.com/bazel-cache-bucket
      GOOGLE_APPLICATION_CREDENTIALS: credentials.json
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y git libxml2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: confirm repository checkout
        run: |
          git config --global --add safe.directory /__w/stepcast-store/stepcast-store
          git status

      - name: Create credentials file
        run: |
          printf '%s' '${{ secrets.GCLOUD_SERVICE_ACCOUNT }}' > credentials.json

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment

      - name: Create symlink to external packages
        run: |
          ln -s $(bazel info output_base)/external external

      - name: Run non-stress C++ tests
        timeout-minutes: 30
        shell: bash
        run: |
          bazel test //core/... \
            --test_tag_filters="-stress,-rdma,-multi_gpu" \
            --define use_fake_cuda=true \
            --test_output=errors \
            --test_summary=detailed \
            --test_timeout=500 \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Run stress C++ tests
        timeout-minutes: 30
        shell: bash
        run: |
          bazel test //core/... \
            --test_tag_filters="stress" \
            --define use_fake_cuda=true \
            --test_output=errors \
            --test_summary=detailed \
            --test_timeout=600 \
            --local_test_jobs=1 \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest-m
    container: nvidia/cuda:12.4.0-devel-ubuntu22.04
    defaults:
      run:
        shell: bash
    env:
      USE_FAKE_CUDA: "1"
      CUDA_HOME: "/usr/local/cuda"
      UV_CACHE_DIR: /tmp/.uv-cache
      BAZEL_REMOTE_CACHE: https://storage.googleapis.com/bazel-cache-bucket
      GOOGLE_APPLICATION_CREDENTIALS: credentials.json
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y git libxml2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: confirm repository checkout
        run: |
          git config --global --add safe.directory /__w/stepcast-store/stepcast-store
          git status

      - name: Create credentials file
        run: |
          printf '%s' '${{ secrets.GCLOUD_SERVICE_ACCOUNT }}' > credentials.json

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment

      - name: Run Python linting
        run: |
          uv run ruff check .
          uv run ruff format . --check

      - name: Run type checking
        run: |
          uv run pyright ./scstore
          uv run mypy ./scstore

      - name: Create symlink to external packages
        run: |
          ln -s $(bazel info output_base)/external external

      - name: Generate Protocol Buffers
        run: |
          bash tools/build_proto_python.sh

      - name: Build C++ extensions with fake CUDA
        run: |
          USE_REMOTE=1 USE_FAKE_CUDA=1 BUILD_CORE=1 BUILD_EXTENSION=1 uv run -vvv setup.py build_ext

      - name: Run Python tests
        run: |
          uv run pytest tests/python/ -v --tb=short
