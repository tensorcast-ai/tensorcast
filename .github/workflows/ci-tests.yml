name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  cpp-tests:
    name: C++ Tests
    runs-on: ubuntu-latest-m
    container: nvidia/cuda:12.4.0-devel-ubuntu22.04
    env:
      USE_FAKE_CUDA: "1"
      CUDA_HOME: "/usr/local/cuda"
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y git libxml2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: confirm repository checkout
        run: |
          git config --global --add safe.directory /__w/stepcast-store/stepcast-store
          git status

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment

      - name: Run non-stress C++ tests
        timeout-minutes: 30
        run: |
          bazel test //core/... \
            --test_tag_filters="-stress,-rdma,-multi_gpu" \
            --define use_fake_cuda=true \
            --test_output=errors \
            --test_summary=detailed

      - name: Run stress C++ tests
        timeout-minutes: 30
        run: |
          bazel test //core/... \
            --test_tag_filters="stress" \
            --define use_fake_cuda=true \
            --test_output=errors \
            --test_summary=detailed \
            --test_timeout=600

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest-m
    container: nvidia/cuda:12.4.0-devel-ubuntu22.04
    env:
      USE_FAKE_CUDA: "1"
      CUDA_HOME: "/usr/local/cuda"
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y git libxml2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: confirm repository checkout
        run: |
          git config --global --add safe.directory /__w/stepcast-store/stepcast-store
          git status

      - name: Setup Build Environment
        uses: ./.github/actions/setup-environment

      - name: Build C++ extensions with fake CUDA
        run: |
          USE_FAKE_CUDA=1 BUILD_CORE=1 BUILD_EXTENSION=1 uv run -vvv setup.py build_ext

      - name: Generate Protocol Buffers
        run: |
          bash tools/build_proto_python.sh

      - name: Run Python tests
        run: |
          uv run pytest tests/python/ -v --tb=short

      - name: Run Python linting
        run: |
          uv run ruff check .
          uv run ruff format . --check

      - name: Run type checking
        run: |
          uv run mypy ./scstore