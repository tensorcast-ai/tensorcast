name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tests:
    name: C++ Tests
    runs-on: ubuntu-latest-m
    defaults:
      run:
        shell: bash
    env:
      USE_FAKE_CUDA: "1"
      UV_CACHE_DIR: /tmp/.uv-cache
      BAZEL_REMOTE_CACHE: https://storage.googleapis.com/bazel-cache-bucket
      GOOGLE_APPLICATION_CREDENTIALS: credentials.json
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      # - name: Install system dependencies
        # run: |
          # sudo apt-get update && sudo apt-get install -y git libxml2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: confirm repository checkout
        run: |
          git config --global --add safe.directory /__w/tensorcast/tensorcast
          git status

      - name: Create credentials file
        run: |
          printf '%s' '${{ secrets.GCLOUD_SERVICE_ACCOUNT }}' > credentials.json

      # - name: Setup Build Environment
      #   uses: ./.github/actions/setup-environment
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.16.0

      - name: Create symlink to external packages
        run: |
          ln -s $(bazel info output_base)/external external

      - name: Build libcheckpoint_ext.so
        run: |
          bazel build //core:libcheckpoint_ext.so \
            --define use_fake_cuda=true \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Build tensorcast_daemon (Fake CUDA)
        run: |
          bazel build @folly//folly:config_h_gen \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
          bazel build //daemon:tensorcast_daemon \
            --define use_fake_cuda=true \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Upload libcheckpoint_ext.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcheckpoint_ext-so
          path: bazel-bin/core/libcheckpoint_ext.so
          if-no-files-found: error

      - name: Upload tensorcast_daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: tensorcast-daemon-bin
          path: bazel-bin/daemon/tensorcast_daemon
          if-no-files-found: error

      - name: Restore Bazel external headers cache
        id: cache-externals
        uses: actions/cache@v4
        with:
          path: bazel-external-includes.tar.gz
          key: bazel-external-includes-v11-${{ hashFiles('MODULE.bazel') }}

      - name: Set bazel-bin-dir
        run: |
          ln -sf $(bazel info bazel-bin) bazel-bin
          test -f bazel-bin/external/folly+/folly/folly-config.h || { echo "ERROR: folly-config.h not found"; exit 1; }

      - name: Archive Bazel external headers
        if: steps.cache-externals.outputs.cache-hit != 'true'
        run: |
          # Collect all boost include directories (using -L to follow symlinks)
          BOOST_INCLUDES=$(find -L external -maxdepth 1 -type d -name 'boost.*+' -exec test -d {}/include \; -print | sed 's|$|/include|' | tr '\n' ' ')
          tar -czf bazel-external-includes.tar.gz --dereference \
            external/abseil-cpp+ \
            external/grpc+/include \
            external/protobuf+/src \
            external/gsl+ \
            external/glog+/src \
            external/libevent+/include \
            external/nlohmann_json+/include \
            external/opentelemetry-cpp+ \
            external/fmt+/include \
            external/double-conversion+ \
            external/folly+ \
            bazel-bin/external/folly+ \
            external/yaml-cpp+/include \
            external/fast_float+/include \
            external/jemalloc+/include \
            external/libunwind+/include \
            external/zstd+/lib \
            external/re2+ \
            external/boringssl+/include \
            external/c-ares+/include \
            external/xz+/src \
            external/zlib+ \
            $BOOST_INCLUDES

      - name: Upload Bazel external headers artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazel-external-includes
          path: bazel-external-includes.tar.gz
          if-no-files-found: error

      - name: Archive Bazel generated C++ protos
        run: |
          tar -czf bazel-bin-proto.tgz -C bazel-bin proto

      - name: Upload Bazel generated C++ protos artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazel-bin-proto
          path: bazel-bin-proto.tgz
          if-no-files-found: error

      - name: Run non-stress C++ tests
        timeout-minutes: 30
        shell: bash
        run: |
          bazel test //core/... \
            --test_tag_filters="-stress,-rdma,-multi_gpu" \
            --define use_fake_cuda=true \
            --test_output=errors \
            --test_summary=detailed \
            --test_timeout=500 \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Run stress C++ tests
        timeout-minutes: 30
        shell: bash
        run: |
          bazel test //core/... \
            --test_tag_filters="stress" \
            --define use_fake_cuda=true \
            --test_output=errors \
            --test_summary=detailed \
            --test_timeout=600 \
            --local_test_jobs=1 \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}

  python-tests:
    name: Python Tests
    needs: cpp-tests
    runs-on: ubuntu-latest-m
    defaults:
      run:
        shell: bash
    env:
      USE_FAKE_CUDA: "1"
      UV_CACHE_DIR: /tmp/.uv-cache
      BAZEL_REMOTE_CACHE: https://storage.googleapis.com/bazel-cache-bucket
      GOOGLE_APPLICATION_CREDENTIALS: credentials.json
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      CUDA_HOME: /usr/local/cuda
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: confirm repository checkout
        run: |
          git config --global --add safe.directory /__w/tensorcast/tensorcast
          git status

      - name: Create credentials file
        run: |
          printf '%s' '${{ secrets.GCLOUD_SERVICE_ACCOUNT }}' > credentials.json

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.11"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Set up Python
        shell: bash
        run: uv python install

      - name: Install Python dependencies
        shell: bash
        run: uv sync --locked --all-extras --dev

      - name: Run Python linting
        run: |
          uv run ruff check .
          uv run ruff format . --check

      - name: Download libcheckpoint_ext.so artifact
        uses: actions/download-artifact@v4
        with:
          name: libcheckpoint_ext-so
          path: .

      - name: Stage libcheckpoint_ext.so for setup.py
        run: |
          mkdir -p bazel-bin/core
          mkdir -p bazel-bin/daemon
          cp -f libcheckpoint_ext.so bazel-bin/core/libcheckpoint_ext.so

      - name: Download tensorcast_daemon artifact
        uses: actions/download-artifact@v4
        with:
          name: tensorcast-daemon-bin
          path: bazel-bin/daemon

      - name: Make tensorcast_daemon executable
        run: |
          chmod +x bazel-bin/daemon/tensorcast_daemon

      - name: Restore Bazel external headers cache
        id: cache-externals
        uses: actions/cache@v4
        with:
          path: bazel-external-includes.tar.gz
          key: bazel-external-includes-v11-${{ hashFiles('MODULE.bazel') }}

      - name: Download Bazel external headers artifact
        uses: actions/download-artifact@v4
        if: steps.cache-externals.outputs.cache-hit != 'true'
        with:
          name: bazel-external-includes
          path: .

      - name: Extract Bazel external headers
        run: |
          tar -xzf bazel-external-includes.tar.gz
          ls -la .
          ls -la bazel-bin
          ls -la bazel-bin/external/folly+
          ls -la bazel-bin/external/folly+/folly

      - name: Download Bazel generated C++ protos artifact
        uses: actions/download-artifact@v4
        with:
          name: bazel-bin-proto
          path: .

      - name: Extract Bazel generated C++ protos
        run: |
          mkdir -p bazel-bin
          tar -xzf bazel-bin-proto.tgz -C bazel-bin

      # - name: Restore Buf proto/gen cache
      #   id: restore-buf-proto-gen
      #   uses: actions/cache/restore@v4
      #   with:
      #     path: head/proto/gen
      #     key: proto-gen-${{ hashFiles('proto/**/*.proto', 'proto/buf.gen.yaml', 'proto/buf.yaml') }}
      #     restore-keys: |
      #       proto-gen-

      # - name: Sync restored proto/gen to ./proto/gen
      #   if: steps.restore-buf-proto-gen.outputs.cache-hit == 'true'
      #   run: |
      #     rm -rf proto/gen
      #     mkdir -p proto/gen
      #     cp -a head/proto/gen/. proto/gen/

      - name: Setup Buf CLI
        # if: steps.restore-buf-proto-gen.outputs.cache-hit != 'true'
        uses: bufbuild/buf-setup-action@v1

      - name: Generate protos via Buf
        # if: steps.restore-buf-proto-gen.outputs.cache-hit != 'true'
        run: bash ./tools/build_proto_python.sh raw
        shell: bash

      - name: Build C++ extensions with fake CUDA
        run: |
          USE_FAKE_CUDA=1 BUILD_EXTENSION=1 uv run -vvv setup.py build_ext

      - name: Run type checking
        run: |
          uv run pyright ./tensorcast
          uv run mypy ./tensorcast

      # - name: Smoke test C++ StoreDaemon via CLI
      #   env:
      #     TENSORCAST_DAEMON_BIN: ${{ github.workspace }}/tensorcast_daemon
      #     UV_NO_SYNC: "1"
      #   run: |
      #     set -euxo pipefail
      #     PORT=17073
      #     uv run -q python -m tensorcast.cli start --non-blocking --host 127.0.0.1 --port ${PORT}
      #     deadline=$((SECONDS+10))
      #     ok=0
      #     while (( SECONDS < deadline )); do
      #       if uv run -q python -c "import grpc; from tensorcast.proto import store_daemon_pb2 as pb2, store_daemon_pb2_grpc as pb2g; stub=pb2g.StoreDaemonStub(grpc.insecure_channel('127.0.0.1:${PORT}')); stub.GetServerConfig(pb2.GetServerConfigRequest(), timeout=2.0)" >/dev/null 2>&1; then
      #         echo READY
      #         ok=1
      #         break
      #       fi
      #       sleep 0.5
      #     done
      #     if [ "$ok" -ne 1 ]; then
      #       echo NOT_READY
      #       exit 1
      #     fi
      #     uv run -q python -m tensorcast.cli stop || true

      - name: Run Python tests
        run: |
          uv run pytest tests/python/ -v --tb=short
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/tensorcast/lib:${{ env.LD_LIBRARY_PATH }}
        shell: bash