name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tests:
    name: C++ Tests
    runs-on: ubuntu-latest-m
    defaults:
      run:
        shell: bash
    env:
      USE_FAKE_CUDA: "1"
      CUDA_HOME: "/usr/local/cuda"
      UV_CACHE_DIR: /tmp/.uv-cache
      BAZEL_REMOTE_CACHE: https://storage.googleapis.com/bazel-cache-bucket
      GOOGLE_APPLICATION_CREDENTIALS: credentials.json
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y git libxml2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: confirm repository checkout
        run: |
          git config --global --add safe.directory /__w/tensorcast/tensorcast
          git status

      - name: Create credentials file
        run: |
          printf '%s' '${{ secrets.GCLOUD_SERVICE_ACCOUNT }}' > credentials.json

      # - name: Setup Build Environment
      #   uses: ./.github/actions/setup-environment
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelisk-version: 1.16.0

      - name: Create symlink to external packages
        run: |
          ln -s $(bazel info output_base)/external external

      - name: Build libstore_engine.so
        run: |
          bazel build //core:libstore_engine.so \
            --define use_fake_cuda=true \
            --config=remote

      - name: Upload libstore_engine.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libstore_engine-so
          path: bazel-bin/core/libstore_engine.so
          if-no-files-found: error

      - name: Restore Bazel external headers cache
        id: cache-externals
        uses: actions/cache@v4
        with:
          path: bazel-external-includes.tar.gz
          key: bazel-external-includes-${{ hashFiles('MODULE.bazel') }}

      - name: Archive Bazel external headers
        if: steps.cache-externals.outputs.cache-hit != 'true'
        run: |
          tar -czf bazel-external-includes.tar.gz --dereference \
            external/abseil-cpp+ \
            external/grpc+/include \
            external/protobuf+/src \
            external/gsl+ \
            external/nlohmann_json+/include

      - name: Upload Bazel external headers artifact
        uses: actions/upload-artifact@v4
        with:
          name: bazel-external-includes
          path: bazel-external-includes.tar.gz
          if-no-files-found: error

      - name: Run non-stress C++ tests
        timeout-minutes: 30
        shell: bash
        run: |
          bazel test //core/... \
            --test_tag_filters="-stress,-rdma,-multi_gpu" \
            --define use_fake_cuda=true \
            --test_output=errors \
            --test_summary=detailed \
            --test_timeout=500 \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Run stress C++ tests
        timeout-minutes: 30
        shell: bash
        run: |
          bazel test //core/... \
            --test_tag_filters="stress" \
            --define use_fake_cuda=true \
            --test_output=errors \
            --test_summary=detailed \
            --test_timeout=600 \
            --local_test_jobs=1 \
            --config=remote \
            --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}

  python-tests:
    name: Python Tests
    needs: cpp-tests
    runs-on: ubuntu-latest-m
    defaults:
      run:
        shell: bash
    env:
      USE_FAKE_CUDA: "1"
      CUDA_HOME: "/usr/local/cuda"
      UV_CACHE_DIR: /tmp/.uv-cache
      BAZEL_REMOTE_CACHE: https://storage.googleapis.com/bazel-cache-bucket
      GOOGLE_APPLICATION_CREDENTIALS: credentials.json
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y \
            git libxml2 \
            libabsl-dev nlohmann-json3-dev

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: confirm repository checkout
        run: |
          git config --global --add safe.directory /__w/tensorcast/tensorcast
          git status

      - name: Create credentials file
        run: |
          printf '%s' '${{ secrets.GCLOUD_SERVICE_ACCOUNT }}' > credentials.json

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.11"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Set up Python
        shell: bash
        run: uv python install

      - name: Install Python dependencies
        shell: bash
        run: uv sync --locked --all-extras --dev

      - name: Run Python linting
        run: |
          uv run ruff check .
          uv run ruff format . --check

      - name: Run type checking
        run: |
          uv run pyright ./scstore
          uv run mypy ./scstore

      - name: Download libstore_engine.so artifact
        uses: actions/download-artifact@v4
        with:
          name: libstore_engine-so
          path: .

      - name: Stage libstore_engine.so for setup.py
        run: |
          mkdir -p bazel-bin/core
          cp -f libstore_engine.so bazel-bin/core/libstore_engine.so

      - name: Restore Bazel external headers cache
        id: cache-externals
        uses: actions/cache@v4
        with:
          path: bazel-external-includes.tar.gz
          key: bazel-external-includes-${{ hashFiles('MODULE.bazel') }}

      - name: Download Bazel external headers artifact
        uses: actions/download-artifact@v4
        if: steps.cache-externals.outputs.cache-hit != 'true'
        with:
          name: bazel-external-includes
          path: .

      - name: Extract Bazel external headers
        run: |
          tar -xzf bazel-external-includes.tar.gz

      - name: Generate Python Protocol Buffers (no Bazel)
        run: |
          uv run python -m grpc_tools.protoc \
              --python_out=scstore/proto \
              --pyi_out=scstore/proto \
              --grpc_python_out=scstore/proto \
              --proto_path=proto \
              proto/store_daemon.proto
          uv run python -m grpc_tools.protoc \
              --python_out=scstore/proto \
              --pyi_out=scstore/proto \
              --grpc_python_out=scstore/proto \
              --proto_path=proto \
              proto/global_store.proto
          sed -i 's/^import store_daemon_pb2/import scstore.proto.store_daemon_pb2/' scstore/proto/store_daemon_pb2_grpc.py
          sed -i 's/^import global_store_pb2/import scstore.proto.global_store_pb2/' scstore/proto/global_store_pb2_grpc.py

      - name: Build C++ extensions with fake CUDA
        run: |
          USE_FAKE_CUDA=1 BUILD_EXTENSION=1 uv run -vvv setup.py build_ext

      - name: Run Python tests
        run: |
          uv run pytest tests/python/ -v --tb=short
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/scstore/lib:${{ env.LD_LIBRARY_PATH }}
        shell: bash
