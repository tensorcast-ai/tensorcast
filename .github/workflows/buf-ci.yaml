name: Buf CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  delete:
permissions:
  contents: read
  pull-requests: write
jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            path: head
      - uses: actions/checkout@v4
        with:
            path: base
            ref: ${{ github.event.pull_request.base.sha }}
      - name: Install protoc v31.1
        run: |
          curl -L -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d $RUNNER_TEMP/protoc
          echo "$RUNNER_TEMP/protoc/bin" >> $GITHUB_PATH
          export PATH="$RUNNER_TEMP/protoc/bin:$PATH"
          protoc --version
      - uses: bufbuild/buf-action@v1
        with:
            input: head/proto
            breaking: false
            # breaking: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && !contains((github.event.head_commit.message || github.event.pull_request.title || ''), 'buf skip breaking') }}
            breaking_against: base/proto
            pr_comment: false
            # Publishing schema changes to the BSR requires a BSR authentication token.
            token: ${{ secrets.BUF_TOKEN }}
            # Include this line if you only want to set up the Action and do nothing else.
            # setup_only: true
            # Include a GitHub token to ensure API requests aren't rate limited.
            # github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore proto/gen cache
        id: restore-proto-gen
        uses: actions/cache/restore@v4
        with:
          path: head/proto/gen
          key: proto-gen-${{ hashFiles('head/proto/**/*.proto', 'head/proto/buf.gen.yaml', 'head/proto/buf.yaml') }}
      - name: Setup Buf CLI
        if: steps.restore-proto-gen.outputs.cache-hit != 'true'
        uses: bufbuild/buf-setup-action@v1.50.0
      - name: Generate
        if: steps.restore-proto-gen.outputs.cache-hit != 'true'
        run: cd head/proto && buf generate
      - name: Save proto/gen cache
        if: steps.restore-proto-gen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: head/proto/gen
          key: proto-gen-${{ hashFiles('head/proto/**/*.proto', 'head/proto/buf.gen.yaml', 'head/proto/buf.yaml') }}
