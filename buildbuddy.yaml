actions:
  - name: "Test C++ targets"
    container_image: "ubuntu-22.04"
    triggers:
      push:
        branches:
          - "main" # <-- replace "main" with your main branch name
      pull_request:
        branches:
          - "*"
    steps:
      - run: sudo apt-get update && sudo apt-get install -y git libxml2
      - run: bazel test //core/... --build_metadata=COMMIT_SHA=$(git rev-parse HEAD) --config=remote