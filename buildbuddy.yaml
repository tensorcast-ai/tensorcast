actions:
  - name: "Test C++ targets"
    container_image: "ubuntu-22.04"
    triggers:
      push:
        branches:
          - "main" # <-- replace "main" with your main branch name
      pull_request:
        branches:
          - "*"
    steps:
      - run: |
          CUDA_HOME=/usr/local/cuda \
          bazel test //core/... \
            --build_metadata=COMMIT_SHA=$(git rev-parse HEAD) \
            --define use_fake_cuda=true \
            --config=remote \
            --host_platform=//:docker_image_platform
