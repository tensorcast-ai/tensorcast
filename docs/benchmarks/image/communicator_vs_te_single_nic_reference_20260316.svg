<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760">
<rect width="100%" height="100%" fill="#f7f4ec"/>
<text x="560.0" y="34.0" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle">Single-NIC Large-Block Read Sweep</text>
<text x="560.0" y="60.0" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Single logical read requests in direct RDMA mode. Bars compare communicator vs Transfer Engine; dashed lines keep raw IB verbs references visible.</text>
<text x="560.0" y="82.0" font-family="Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">32 MiB uses 0496 GPU0/mlx5_7 -> 0078 GPU0/mlx5_4. 64 MiB uses 0496 GPU1/mlx5_1 -> 0078 GPU1/mlx5_1. 256 MiB to 4 GiB use 0496 GPU0/mlx5_2 -> 0550 GPU0/mlx5_5.</text>
<text x="90.0" y="112.0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Large Single-Request Read Throughput</text>
