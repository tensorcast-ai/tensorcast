# Test configuration for lifecycle management features

server:
  host: 0.0.0.0
  port: 50052
  storage_path: /tmp/test_artifacts
  num_thread: 10
  chunk_size: 134217728  # 128MB
  mem_pool_size: 8589934592  # 8GB
  enable_p2p_access: false
  enable_p2p_engine: true
  pinned_memory_timeout_ms: 30000

worker_management:
  enabled: true
  global_store_address: localhost:50051
  heartbeat_interval_ms: 5000
  registration_retry_delay_ms: 1000

network:
  p2p_port: 9090
  grpc_port: 50052

shutdown:
  grace_period_ms: 30000
  unregister_timeout_ms: 5000

monitoring:
  metrics_port: 9091
  health_check_port: 8080

# Lifecycle management configuration
lifecycle:
  proc_check_interval_s: 2.0      # Check process status every 2 seconds
  eviction_check_interval_s: 10.0  # Check for eviction every 10 seconds
  gpu_memory_limit_fraction: 0.85  # Trigger eviction when GPU usage > 85%
  global_cache_fraction: 0.25      # Reserve 25% of GPU memory for global cache