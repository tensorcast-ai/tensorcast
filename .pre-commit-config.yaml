default_install_hook_types:
  - pre-commit
  - commit-msg
exclude: ^.github/actions/assigner/dist
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: check-yaml
            args: [--allow-multiple-documents]
          - id: trailing-whitespace
            exclude: ^docs
          - id: check-added-large-files
            args:
                - --maxkb=1000
          - id: check-vcs-permalinks
          - id: check-merge-conflict
          - id: mixed-line-ending
            args:
                - --fix=lf
            exclude: ^docs
    - repo: https://github.com/compilerla/conventional-pre-commit
      rev: v4.2.0
      hooks:
        - id: conventional-pre-commit
          stages: [commit-msg]
          args: []
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v20.1.5
      hooks:
          - id: clang-format
            types_or: [c++, c, cuda]
    - repo: https://github.com/keith/pre-commit-buildifier
      rev: 8.0.3
      hooks:
          - id: buildifier
            args:
                - --warnings=all
          - id: buildifier-lint
    - repo: https://github.com/abravalheri/validate-pyproject
      rev: v0.24.1
      hooks:
          - id: validate-pyproject
    # - repo: https://github.com/pycqa/isort
    #   rev: 6.0.0
    #   hooks:
    #       - id: isort
    #         name: isort (python)
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: "v1.16.0"
      hooks:
          - id: mypy
            exclude: '(^tensorcast/proto/.*\.pyi$|.*_pb2\.py$)' # Exclude proto .pyi and generated protobuf .py
    - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
      rev: v0.11.12
      hooks:
          - id: ruff-check
            args: [ --fix ]
          # Run the formatter.
          - id: ruff-format
    - repo: https://github.com/crate-ci/typos
      rev: v1.34.0
      hooks:
          - id: typos
    - repo: https://github.com/Lucas-C/pre-commit-hooks
      rev: v1.5.4
      hooks:
        - id: insert-license
          name: Add license for C++ files
          files: \.(h|cc|cpp)$
          args:
            - --license-filepath=.license-header-cpp.txt
            - --comment-style=//
            - --detect-license-in-X-top-lines=5
            - --use-current-year
        - id: insert-license
          name: Add license for Python files
          files: \.py$
          args:
            - --license-filepath=.license-header-python.txt
            - --comment-style=#
            - --detect-license-in-X-top-lines=5
            - --use-current-year