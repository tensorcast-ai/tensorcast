apiVersion: v1
kind: ConfigMap
metadata:
  name: store-daemon-config
  namespace: tensorcast
  labels:
    app: store-daemon
data:
  store_daemon.yaml: |
    meta:
      schema_version: "v1"
      description: "public-k8s-store-daemon"
      cluster_token: ""
    server:
      listen:
        host: 0.0.0.0
        port: 50052
      advertise:
        host: ""
      p2p_listen:
        host: 0.0.0.0
        port: 65090
      storage_path: "/var/lib/tensorcast/store"
      num_threads: 8
    engine:
      artifact_chunk_bytes: 256MB
      streaming_buffer_chunks: 4
      memory_tiers:
        enable_preemptible: false
        stable_bytes: 64MB
        preemptible_limit_bytes: 0
        preemptible_low_watermark_ratio: 0.4
    pinned_memory:
      allocation_timeout: 30s
      classes:
        - name: engine
          slice_bytes: 64MB
          pool_bytes: 2GB
        - name: comm_gpu
          slice_bytes: 16MB
          pool_bytes: 1GB
        - name: comm_cpu
          slice_bytes: 4MB
          pool_bytes: 64MB
    high_availability:
      enabled: true
      global_store_endpoints:
        - host: global-store.tensorcast.svc.cluster.local
          port: 50051
      heartbeat_interval: 5s
      registration_retry_delay: 5s
      max_retries: -1
    lifecycle:
      gpu_memory_limit_fraction: 0.8
      proc_check_interval: 5s
      eviction_check_interval: 15s
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: store-daemon
  namespace: tensorcast
  labels:
    app: store-daemon
spec:
  selector:
    matchLabels:
      app: store-daemon
  template:
    metadata:
      labels:
        app: store-daemon
    spec:
      containers:
        - name: store-daemon
          image: ghcr.io/tensorcast-ai/tensorcast:latest
          imagePullPolicy: IfNotPresent
          command:
            - tensorcast-cli
          args:
            - daemon
            - start
            - --blocking
            - --config
            - /etc/tensorcast/store_daemon.yaml
            - --global-store-mode
            - connect
            - --global-store-address
            - global-store.tensorcast.svc.cluster.local:50051
          ports:
            - name: grpc
              containerPort: 50052
            - name: p2p
              containerPort: 65090
          volumeMounts:
            - name: config
              mountPath: /etc/tensorcast/store_daemon.yaml
              subPath: store_daemon.yaml
              readOnly: true
            - name: data
              mountPath: /var/lib/tensorcast/store
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      volumes:
        - name: config
          configMap:
            name: store-daemon-config
        - name: data
          emptyDir: {}
  updateStrategy:
    type: RollingUpdate
