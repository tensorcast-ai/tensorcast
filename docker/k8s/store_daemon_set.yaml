---
apiVersion: v1
kind: ConfigMap
metadata:
  name: store-daemon-config
  namespace: tensorcast
  labels:
    app: store-daemon
  annotations:
    kubernetes.io/description: StoreDaemon default configuration
data:
  store-daemon.yaml: |
    server:
      listen:
        host: "0.0.0.0"
        port: 61052
      p2p_listen:
        host: "0.0.0.0"
        port: 65090
      storage_path: "/mnt/stepcloud/prod/"
      num_threads: 16

    engine:
      artifact_chunk_bytes: 256MB
      streaming_buffer_chunks: 16

    pinned_memory:
      # Phase 1 fixed-allocation: total pinned bytes is derived as sum(classes[].pool_bytes)
      allocation_timeout: 30s
      classes:
        - name: engine
          slice_bytes: 256MB
          pool_bytes: 8GB
        - name: comm_gpu
          slice_bytes: 16MB
          pool_bytes: 8GB
        - name: comm_cpu
          slice_bytes: 4MB
          pool_bytes: 1GB

    high_availability:
      enabled: true
      global_store_endpoints:
        - host: "10.148.40.11"
          port: 50051
      heartbeat_interval: 30s
      registration_retry_delay: 5s
      max_retries: -1

    lifecycle:
      gpu_memory_limit_fraction: 0.1
      proc_check_interval: 5s
      eviction_check_interval: 15s

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: store-daemon-set
  namespace: tensorcast
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: store-daemon
  template:
    metadata:
      annotations:
      labels:
        app: store-daemon
        logs.monitoring.basemind.com/collect: 'true'
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodeGroup
                    operator: NotIn
                    values:
                      - aliyun-juicefs
                      - aliyun-juicefs-shanghai
                  - key: step.com/cloud-provider
                    operator: In
                    values:
                      - ali
      containers:
        - name: store-daemon
          image: 'hub.i.basemind.com/tensorcast/tensorcast:2025.07.11-3d8ec'
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args:
            - -m
            - tensorcast.cli
            - start
            - "--config"
            - /etc/tensorcast/store-daemon.yaml
            - "--blocking"
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          ports:
            - containerPort: 61052
              name: grpc
              protocol: TCP
            - containerPort: 65090
              name: p2p
              protocol: TCP

          livenessProbe:
            tcpSocket:
              port: 61052
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 61052
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: '12'
              memory: 48Gi
            requests:
              cpu: '4'
              memory: 16Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: config
              mountPath: /etc/tensorcast/store-daemon.yaml
              subPath: store-daemon.yaml
            - mountPath: /mnt/stepcloud
              mountPropagation: HostToContainer
              name: stepcloud-sh-aliyun-juicefs-pvc
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: nvidia-driver
              mountPath: /usr/local/nvidia
            - name: dev
              mountPath: /dev
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      restartPolicy: Always
      schedulerName: default-scheduler
      hostPID: true
      hostIPC: true
      securityContext:
        privileged: true
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
        - effect: NoSchedule
          key: node.kubernetes.io/disk-pressure
          operator: Exists
        - effect: NoSchedule
          key: node.kubernetes.io/memory-pressure
          operator: Exists
        - effect: NoSchedule
          key: node.kubernetes.io/pid-pressure
          operator: Exists
        - effect: NoSchedule
          key: node.kubernetes.io/unschedulable
          operator: Exists
      volumes:
        - emptyDir: {}
          name: tmp
        - name: config
          configMap:
            name: store-daemon-config
        - name: stepcloud-sh-aliyun-juicefs-pvc
          persistentVolumeClaim:
            claimName: stepcloud-sh-aliyun-juicefs-pvc
        - name: nvidia-driver
          hostPath:
            path: /usr/local/nvidia
        - name: dev
          hostPath:
            path: /dev
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: "100%"
