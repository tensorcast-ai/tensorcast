apiVersion: v1
kind: Namespace
metadata:
  name: tensorcast
---
apiVersion: v1
kind: Service
metadata:
  name: global-store
  namespace: tensorcast
  labels:
    app: global-store
spec:
  type: ClusterIP
  selector:
    app: global-store
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: metrics
      port: 8001
      targetPort: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: global-store-config
  namespace: tensorcast
data:
  global_store.yaml: |
    meta:
      schema_version: "v1"
      description: "public-k8s-global-store"
      cluster_token: ""
    database:
      db_file: /data/models.db
    server:
      listen:
        host: 0.0.0.0
        port: 50051
      advertise:
        host: global-store.tensorcast.svc.cluster.local
        port: 50051
      max_workers: 10
      metrics_port: 8001
    worker_policy:
      heartbeat_timeout: 30s
      cleanup_interval: 60s
      default_heartbeat_interval: 5s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: global-store
  namespace: tensorcast
  labels:
    app: global-store
spec:
  serviceName: global-store
  replicas: 1
  selector:
    matchLabels:
      app: global-store
  template:
    metadata:
      labels:
        app: global-store
    spec:
      containers:
        - name: global-store
          image: ghcr.io/tensorcast-ai/tensorcast:latest
          imagePullPolicy: IfNotPresent
          command:
            - tensorcast-cli
          args:
            - global
            - start
            - --blocking
            - --config
            - /etc/tensorcast/global_store.yaml
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 8001
          volumeMounts:
            - name: config
              mountPath: /etc/tensorcast/global_store.yaml
              subPath: global_store.yaml
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: config
          configMap:
            name: global-store-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
